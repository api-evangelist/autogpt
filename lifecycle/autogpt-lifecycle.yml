sla:
  url: null
  public_uptime_target: null
  notes: >-
    No SLA is published. The pricing page names "priority support" on the Max
    plan and "security options" on the (coming-soon) Team plan, but states no
    availability commitment.
status_page:
  published: false
  probes:
    - url: https://status.agpt.co/
      status: '<no response> — DNS does not resolve'
    - url: https://agpt.co/status
      status: 404
    - url: https://autogpt.statuspage.io
      status: 200
      note: >-
        NOT AutoGPT's status page. It 302s to
        https://www.atlassian.com/software/statuspage — the Statuspage product
        marketing site. The subdomain is unclaimed. Recorded here so a later run
        does not mistake the 200 for a served status page.
  health_endpoint:
    url: https://backend.agpt.co/health
    status: 200
    body: '{"status":"healthy"}'
    note: >-
      A liveness probe, not a status page. It is the only availability signal
      AutoGPT exposes to the public.
