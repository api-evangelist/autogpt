openapi: 3.2.0
info:
  title: AutoGPT Agent Server Otto API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: otto
paths:
  /api/otto/ask:
    post:
      tags:
      - otto
      summary: Proxy Otto Chat Request
      description: 'Proxy requests to Otto API while adding necessary security headers and logging.

        Requires an authenticated user.'
      operationId: postV2ProxyOttoChatRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV2Proxy otto chat request
components:
  responses:
    HTTP401NotAuthenticatedError:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Message:
      properties:
        query:
          type: string
          title: Query
        response:
          type: string
          title: Response
      type: object
      required:
      - query
      - response
      title: Message
    ChatRequest:
      properties:
        query:
          type: string
          title: Query
        conversation_history:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Conversation History
        message_id:
          type: string
          title: Message Id
        include_graph_data:
          type: boolean
          title: Include Graph Data
          default: false
        graph_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Graph Id
      type: object
      required:
      - query
      - conversation_history
      - message_id
      title: ChatRequest
    ApiResponse:
      properties:
        answer:
          type: string
          title: Answer
        documents:
          items:
            $ref: '#/components/schemas/Document'
          type: array
          title: Documents
        success:
          type: boolean
          title: Success
      type: object
      required:
      - answer
      - documents
      - success
      title: ApiResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Document:
      properties:
        url:
          type: string
          title: Url
        relevance_score:
          type: number
          title: Relevance Score
      type: object
      required:
      - url
      - relevance_score
      title: Document
  securitySchemes:
    APIKeyAuthenticator-X-Postmark-Webhook-Token:
      type: apiKey
      in: header
      name: X-Postmark-Webhook-Token
    HTTPBearer:
      type: http
      scheme: bearer
    HTTPBearerJWT:
      type: http
      scheme: bearer
      bearerFormat: jwt
