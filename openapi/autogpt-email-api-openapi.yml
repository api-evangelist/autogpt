        Recipient:
          type: string
          title: Recipient
        MessageID:
          type: string
          title: Messageid
        ReceivedAt:
          type: string
          title: Receivedat
        Platform:
          type: string
          title: Platform
        ReadSeconds:
          type: integer
          title: Readseconds
        Tag:
          type: string
          title: Tag
        UserAgent:
          type: string
          title: Useragent
        OS:
          additionalProperties:
            type: string
          type: object
          title: Os
        Client:
          additionalProperties:
            type: string
          type: object
          title: Client
        Geo:
          additionalProperties:
            type: string
          type: object
          title: Geo
      type: object
      required:
      - MessageStream
      - Metadata
      - FirstOpen
      - Recipient
      - MessageID
      - ReceivedAt
      - Platform
      - ReadSeconds
      - Tag
      - UserAgent
      - OS
      - Client
      - Geo
      title: PostmarkOpenWebhook
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PostmarkBounceEnum:
      type: integer
      enum:
      - 1
      - 2
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
      - 100000
      - 100001
      - 100002
      - 100003
      - 100006
      - 100007
      - 100008
      - 100009
      - 100010
      title: PostmarkBounceEnum
    PostmarkSpamComplaintWebhook:
      properties:
        RecordType:
          type: string
          const: SpamComplaint
          title: Recordtype
          default: SpamComplaint
        ID:
          type: integer
          title: Id
        Type:
          type: string
          title: Type
        TypeCode:
          type: integer
          title: Typecode
        Tag:
          type: string
          title: Tag
        MessageID:
          type: string
          title: Messageid
        Details:
          type: string
          title: Details
        Email:
          type: string
          title: Email
        From:
          type: string
          title: From
        BouncedAt:
          type: string
          title: Bouncedat
        Inactive:
          type: boolean
          title: Inactive
        DumpAvailable:
          type: boolean
          title: Dumpavailable
        CanActivate:
          type: boolean
          title: Canactivate
        Subject:
