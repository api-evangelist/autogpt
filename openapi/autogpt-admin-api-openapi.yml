          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotAnalyticsSummary'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Bot usage summary
  /api/admin/bot-analytics/timeseries:
    get:
      tags:
      - Admin
