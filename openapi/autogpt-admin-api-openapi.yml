openapi: 3.2.0
info:
  title: AutoGPT Agent Server Admin API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: Admin
paths:
  /api/admin/blocks/cost-estimates:
    get:
      tags:
      - Admin
      summary: Export Block Cost Estimates
      description: 'Aggregate per-block average credits-per-execution over [start, end].


        Capped at ANALYTICS_MAX_DAYS days. Returns only blocks whose current cost

        type is dynamic (SECOND/ITEMS/COST_USD) — static-cost blocks already

        charge correctly pre-flight and don''t need an estimate override. TOKENS

        is excluded because `compute_token_credits` already supplies a per-model

        floor at pre-flight; a per-block historical mean would lose that

        granularity.'
      operationId: getV2ExportBlockCostEstimates
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: ISO timestamp (inclusive)
          title: Start
        description: ISO timestamp (inclusive)
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: ISO timestamp (inclusive)
          title: End
        description: ISO timestamp (inclusive)
      - name: min_samples
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Minimum executions per block to include
          default: 10
          title: Min Samples
        description: Minimum executions per block to include
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockCostEstimatesResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Export block cost estimates
  /api/admin/bot-analytics/command-usage:
    get:
      tags:
      - Admin
      summary: Command Usage Breakdown
      operationId: getV2CommandUsageBreakdown
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotCommandUsage'
                title: Response Getv2Command Usage Breakdown
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Command usage breakdown
  /api/admin/bot-analytics/guilds:
    get:
      tags:
      - Admin
      summary: Bot Server Roster
      operationId: getV2BotServerRoster
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: include_left
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Left
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotGuildInfo'
                title: Response Getv2Bot Server Roster
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Bot server roster
  /api/admin/bot-analytics/server-timeseries:
    get:
      tags:
      - Admin
      summary: Bot Server-Count Timeseries (sharding curve)
      operationId: getV2BotServer-countTimeseries(shardingCurve)
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
