          - type: 'null'
          title: Avg Correctness Score
        recent_executions:
          items:
            $ref: '#/components/schemas/RecentExecution'
          type: array
          title: Recent Executions
          description: List of recent executions with status, score, and summary
        can_access_graph:
          type: boolean
          title: Can Access Graph
          description: Indicates whether the same user owns the corresponding graph
        is_latest_version:
          type: boolean
          title: Is Latest Version
        is_favorite:
          type: boolean
          title: Is Favorite
        folder_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder Id
        folder_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder Name
        is_hidden:
          type: boolean
          title: Is Hidden
          default: false
        recommended_schedule_cron:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommended Schedule Cron
        is_scheduled:
          type: boolean
          title: Is Scheduled
          description: Whether this agent has active execution schedules
          default: false
        next_scheduled_run:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Scheduled Run
          description: ISO 8601 timestamp of the next scheduled run, if any
        settings:
          $ref: '#/components/schemas/GraphSettings'
        marketplace_listing:
          anyOf:
          - $ref: '#/components/schemas/MarketplaceListing'
          - type: 'null'
        store_listing_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Store Listing Version Id
          description: ID of the approved marketplace listing version whose graph snapshot exactly matches this agent's graph_id and graph_version. Install flows can use it directly to install this exact version.
      type: object
      required:
      - id
      - graph_id
      - graph_version
      - image_url
      - creator_name
      - creator_image_url
      - status
      - created_at
      - updated_at
      - name
      - description
      - input_schema
      - output_schema
      - credentials_input_schema
      - has_external_trigger
      - has_human_in_the_loop
      - has_sensitive_action
      - new_output
      - can_access_graph
      - is_latest_version
      - is_favorite
