openapi: 3.2.0
info:
  title: AutoGPT Agent Server Library API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: Library
paths:
  /api/library/agents:
    get:
      tags:
      - Library
      summary: List Library Agents
      description: Get all agents in the user's library (both created and saved).
      operationId: getV2ListLibraryAgents
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: search_term
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term to filter agents
          title: Search Term
        description: Search term to filter agents
      - name: sort_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LibraryAgentSort'
          description: Criteria to sort results by
          default: updatedAt
        description: Criteria to sort results by
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number to retrieve (must be >= 1)
          default: 1
          title: Page
        description: Page number to retrieve (must be >= 1)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Number of agents per page (must be >= 1)
          default: 15
          title: Page Size
        description: Number of agents per page (must be >= 1)
      - name: folder_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by folder ID
          title: Folder Id
        description: Filter by folder ID
      - name: include_root_only
        in: query
        required: false
        schema:
          type: boolean
          description: Only return agents without a folder (root-level agents)
          default: false
          title: Include Root Only
        description: Only return agents without a folder (root-level agents)
      - name: is_hidden
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by hidden status. True = only hidden, False = only non-hidden, omit = all agents.
          title: Is Hidden
        description: Filter by hidden status. True = only hidden, False = only non-hidden, omit = all agents.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAgentResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2List library agents
    post:
      tags:
      - Library
      summary: Add Marketplace Agent
      description: Add an agent from the marketplace to the user's library.
      operationId: postV2AddMarketplaceAgent
      security:
      - HTTPBearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_postV2Add_marketplace_agent'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAgent'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV2Add marketplace agent
  /api/library/agents/by-graph/{graph_id}:
    get:
      tags:
      - Library
      summary: Get Library Agent By Graph Id
      operationId: getV2GetLibraryAgentByGraphId
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAgent'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/library/agents/favorites:
    get:
      tags:
      - Library
      summary: List Favorite Library Agents
      description: Get all favorite agents in the user's library.
      operationId: getV2ListFavoriteLibraryAgents
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number to retrieve (must be >= 1)
          default: 1
          title: Page
        description: Page number to retrieve (must be >= 1)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Number of agents per page (must be >= 1)
          default: 15
          title: Page Size
        description: Number of agents per page (must be >= 1)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAgentResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2List favorite library agents
  /api/library/agents/marketplace/{store_listing_version_id}:
    get:
      tags:
      - Library
      summary: Get Agent By Store ID
      description: Get Library Agent from Store Listing Version ID.
      operationId: getV2GetAgentByStoreId
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: store_listing_version_id
        in: path
        required: true
        schema:
          type: string
          title: Store Listing Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/LibraryAgent'
                - type: 'null'
                title: Response Getv2Get Agent By Store Id
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get agent by store id
  /api/library/agents/{library_agent_id}:
    delete:
      tags:
      - Library
      summary: Delete Library Agent
      description: Soft-delete the specified library agent.
      operationId: deleteV2DeleteLibraryAgent
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: library_agent_id
        in: path
        required: true
        schema:
          type: string
          title: Library Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: deleteV2Delete library agent
    get:
      tags:
      - Library
      summary: Get Library Agent
      operationId: getV2GetLibraryAgent
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: library_agent_id
        in: path
        required: true
        schema:
          type: string
          title: Library Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAgent'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get library agent
    patch:
      tags:
      - Library
      summary: Update Library Agent
      description: Update the library agent with the given fields.
      operationId: patchV2UpdateLibraryAgent
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: library_agent_id
        in: path
        required: true
        schema:
          type: string
          title: Library Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryAgentUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAgent'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: patchV2Update library agent
  /api/library/agents/{library_agent_id}/fork:
    post:
      tags:
      - Library
      summary: Fork Library Agent
      operationId: postV2ForkLibraryAgent
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: library_agent_id
        in: path
        required: true
        schema:
          type: string
          title: Library Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAgent'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV2Fork library agent
  /api/library/agents/{library_agent_id}/triggers:
    get:
      tags:
      - Library
      summary: List Trigger Agents
      description: List trigger agents linked to the given parent agent.
      operationId: getV2ListTriggerAgents
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: library_agent_id
        in: path
        required: true
        schema:
          type: string
          title: Library Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryAgent'
                title: Response Getv2List Trigger Agents
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2List trigger agents
  /api/library/folders:
    get:
      tags:
      - Library
      summary: List Library Folders
      description: 'List folders for the authenticated user.


        Args:

        user_id: ID of the authenticated user.

        parent_id: Optional parent folder ID to filter by.

        include_relations: Whether to include agent and subfolder relations for counts.


        Returns:

        A FolderListResponse containing folders.'
      operationId: getV2ListLibraryFolders
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: parent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by parent folder ID. If not provided, returns root-level folders.
          title: Parent Id
        description: Filter by parent folder ID. If not provided, returns root-level folders.
      - name: include_relations
        in: query
        required: false
        schema:
          type: boolean
          description: Include agent and subfolder relations (for counts)
          default: true
          title: Include Relations
        description: Include agent and subfolder relations (for counts)
      responses:
        '200':
          description: List of folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error
      x-operation-id-source: normalized
      x-operation-id-original: getV2List library folders
    post:
      tags:
      - Library
      summary: Create Folder
      description: 'Create a new folder.


        Args:

        payload: The folder creation request.

        user_id: ID of the authenticated user.


        Returns:

        The created LibraryFolder.'
      operationId: postV2CreateFolder
      security:
      - HTTPBearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderCreateRequest'
      responses:
        '201':
          description: Folder created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryFolder'
        '400':
          description: Validation error
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Parent folder not found
        '409':
          description: Folder name conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error
      x-operation-id-source: normalized
      x-operation-id-original: postV2Create folder
  /api/library/folders/agents/bulk-move:
    post:
      tags:
      - Library
      summary: Bulk Move Agents
      description: 'Move multiple agents to a folder.


        Args:

        payload: The bulk move request with agent IDs and target folder.

        user_id: ID of the authenticated user.


        Returns:

        The updated LibraryAgents.'
      operationId: postV2BulkMoveAgents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMoveAgentsRequest'
        required: true
      responses:
        '200':
          description: Agents moved successfully
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LibraryAgent'
                type: array
                title: Response Postv2Bulk Move Agents
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Folder not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV2Bulk move agents
  /api/library/folders/tree:
    get:
      tags:
      - Library
      summary: Get Folder Tree
      description: 'Get the full folder tree for the authenticated user.


        Args:

        user_id: ID of the authenticated user.


        Returns:

        A FolderTreeResponse containing the nested folder structure.'
      operationId: getV2GetFolderTree
      responses:
        '200':
          description: Folder tree structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderTreeResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '500':
          description: Server error
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get folder tree
  /api/library/folders/{folder_id}:
    delete:
      tags:
      - Library
      summary: Delete Folder
      description: 'Soft-delete a folder and all its contents.


        Args:

        folder_id: ID of the folder to delete.

        user_id: ID of the authenticated user.


        Returns:

        204 No Content if successful.'
      operationId: deleteV2DeleteFolder
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: string
          title: Folder Id
      responses:
        '204':
          description: Folder deleted successfully
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Folder not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error
      x-operation-id-source: normalized
      x-operation-id-original: deleteV2Delete folder
    get:
      tags:
      - Library
      summary: Get Folder
      description: 'Get a specific folder.


        Args:

        folder_id: ID of the folder to retrieve.

        user_id: ID of the authenticated user.


        Returns:

        The requested LibraryFolder.'
      operationId: getV2GetFolder
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: string
          title: Folder Id
      responses:
        '200':
          description: Folder details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryFolder'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Folder not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get folder
    patch:
      tags:
      - Library
      summary: Update Folder
      description: 'Update a folder''s properties.


        Args:

        folder_id: ID of the folder to update.

        payload: The folder update request.

        user_id: ID of the authenticated user.


        Returns:

        The updated LibraryFolder.'
      operationId: patchV2UpdateFolder
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: string
          title: Folder Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderUpdateRequest'
      responses:
        '200':
          description: Folder updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryFolder'
        '400':
          description: Validation error
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Folder not found
        '409':
          description: Folder name conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error
      x-operation-id-source: normalized
      x-operation-id-original: patchV2Update folder
  /api/library/folders/{folder_id}/move:
    post:
      tags:
      - Library
      summary: Move Folder
      description: 'Move a folder to a new parent.


        Args:

        folder_id: ID of the folder to move.

        payload: The move request with target parent.

        user_id: ID of the authenticated user.


        Returns:

        The moved LibraryFolder.'
      operationId: postV2MoveFolder
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: string
          title: Folder Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderMoveRequest'
      responses:
        '200':
          description: Folder moved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryFolder'
        '400':
          description: Validation error (circular reference)
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Folder or target parent not found
        '409':
          description: Folder name conflict in target location
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error
      x-operation-id-source: normalized
      x-operation-id-original: postV2Move folder
components:
  schemas:
    GraphSettings:
      properties:
        human_in_the_loop_safe_mode:
          type: boolean
          title: Human In The Loop Safe Mode
          default: true
        sensitive_action_safe_mode:
          type: boolean
          title: Sensitive Action Safe Mode
          default: false
        builder_chat_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Builder Chat Session Id
      type: object
      title: GraphSettings
    FolderListResponse:
      properties:
        folders:
          items:
            $ref: '#/components/schemas/LibraryFolder'
          type: array
          title: Folders
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
      required:
      - folders
      - pagination
      title: FolderListResponse
      description: Response schema for a list of folders.
    LibraryAgentUpdateRequest:
      properties:
        auto_update_version:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Auto Update Version
          description: Auto-update the agent version
        graph_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Graph Version
          description: Specific graph version to update to
        is_favorite:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Favorite
          description: Mark the agent as a favorite
        is_archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Archived
          description: Archive the agent
        is_hidden:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Hidden
          description: Whether to hide the agent from the library listing
        settings:
          anyOf:
          - $ref: '#/components/schemas/GraphSettings'
          - type: 'null'
          description: User-specific settings for this library agent
        folder_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder Id
          description: Folder ID to move agent to (None to move to root)
      type: object
      title: LibraryAgentUpdateRequest
      description: 'Schema for updating a library agent via PUT.


        Includes flags for auto-updating version, marking as favorite,

        archiving, or deleting.'
    LibraryAgentResponse:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/LibraryAgent'
          type: array
          title: Agents
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
      required:
      - agents
      - pagination
      title: LibraryAgentResponse
      description: Response schema for a list of library agents and pagination info.
    FolderCreateRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        icon:
          anyOf:
          - type: string
          - type: 'null'
          title: Icon
        color:
          anyOf:
          - type: string
            pattern: ^#[0-9A-Fa-f]{6}$
          - type: 'null'
          title: Color
          description: Hex color code (#RRGGBB)
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
      type: object
      required:
      - name
      title: FolderCreateRequest
      description: Request model for creating a folder.
    MarketplaceListingCreator:
      properties:
        name:
          type: string
          title: Name
        id:
          type: string
          title: Id
        slug:
          type: string
          title: Slug
      type: object
      required:
      - name
      - id
      - slug
      title: MarketplaceListingCreator
      description: Creator information for a marketplace listing.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Pagination:
      properties:
        total_items:
          type: integer
          title: Total Items
          description: Total number of items.
          examples:
          - 42
        total_pages:
          type: integer
          title: Total Pages
          description: Total number of pages.
          examples:
          - 2
        current_page:
          type: integer
          title: Current Page
          description: Current_page page number.
          examples:
          - 1
        page_size:
          type: integer
          title: Page Size
          description: Number of items per page.
          examples:
          - 25
      type: object
      required:
      - total_items
      - total_pages
      - current_page
      - page_size
      title: Pagination
    LibraryAgentStatus:
      type: string
      enum:
      - COMPLETED
      - HEALTHY
      - WAITING
      - ERROR
      title: LibraryAgentStatus
    LibraryAgent:
      properties:
