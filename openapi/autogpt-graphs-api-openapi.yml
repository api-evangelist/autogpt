openapi: 3.2.0
info:
  title: Autogpt Graphs API
  version: '1.0'
  description: 'Operations tagged Graphs across 2 of this provider''s published API definitions: autogpt-agent-server-openapi.json, autogpt-external-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /external-api
tags:
- name: Graphs
paths:
  /api/graphs/{graph_id}/executions/{graph_exec_id}/share:
    delete:
      tags:
      - Graphs
      summary: Disable Execution Sharing
      description: Disable sharing for a graph execution.
      operationId: deleteV1DisableExecutionSharing
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: graph_exec_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Exec Id
      responses:
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Graphs
      summary: Enable Execution Sharing
      description: Enable sharing for a graph execution.
      operationId: postV1EnableExecutionSharing
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: graph_exec_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Exec Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
              default: {}
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/backend__api__features__v1__ShareResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/executions:
    get:
      tags:
      - Graphs
      summary: List all executions
      operationId: getV1ListAllExecutions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphExecutionMeta'
                type: array
                title: Response Getv1List All Executions
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: getV1List all executions
  /api/executions/cost-summary:
    get:
      tags:
      - Graphs
      summary: User cost summary
      description: Aggregated cost breakdown for the calling user's graph executions.
      operationId: getV1UserCostSummary
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Window start (UTC). Defaults to start of current calendar month.
          title: Since
        description: Window start (UTC). Defaults to start of current calendar month.
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Window end (UTC). Defaults to now.
          title: Until
        description: Window end (UTC). Defaults to now.
      - name: top_runs_limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Maximum number of top-cost runs to return.
          default: 10
          title: Top Runs Limit
        description: Maximum number of top-cost runs to return.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExecutionCostSummary'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV1User cost summary
  /api/executions/{graph_exec_id}:
    delete:
      tags:
      - Graphs
      summary: Delete graph execution
      operationId: deleteV1DeleteGraphExecution
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_exec_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Exec Id
      responses:
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: deleteV1Delete graph execution
  /api/graphs:
    get:
      tags:
      - Graphs
      summary: List user graphs
      operationId: getV1ListUserGraphs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphMeta'
                type: array
                title: Response Getv1List User Graphs
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: getV1List user graphs
    post:
      tags:
      - Graphs
      summary: Create new graph
      operationId: postV1CreateNewGraph
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGraph'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphModel'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV1Create new graph
  /api/graphs/{graph_id}:
    delete:
      tags:
      - Graphs
      summary: Delete graph permanently
      operationId: deleteV1DeleteGraphPermanently
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGraphResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: deleteV1Delete graph permanently
    get:
      tags:
      - Graphs
      summary: Get specific graph
      operationId: getV1GetSpecificGraph
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      - name: for_export
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: For Export
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphModel'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV1Get specific graph
    put:
      tags:
      - Graphs
      summary: Update graph version
      operationId: putV1UpdateGraphVersion
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Graph'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGraphResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: putV1Update graph version
  /api/graphs/{graph_id}/execute/{graph_version}:
    post:
      tags:
      - Graphs
      summary: Execute graph agent
      operationId: postV1ExecuteGraphAgent
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: graph_version
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Graph Version
      - name: preset_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Preset Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_postV1Execute_graph_agent'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphExecutionMeta'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '402':
          description: 'Payment required: NO_TIER paywall, or insufficient credit balance'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: Subscription state temporarily unavailable
      x-operation-id-source: normalized
      x-operation-id-original: postV1Execute graph agent
  /api/graphs/{graph_id}/executions:
    get:
      tags:
      - Graphs
      summary: List graph executions
      operationId: getV1ListGraphExecutions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of executions per page
          default: 25
          title: Page Size
        description: Number of executions per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphExecutionsPaginated'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV1List graph executions
  /api/graphs/{graph_id}/executions/{graph_exec_id}:
    get:
      tags:
      - Graphs
      summary: Get execution details
      operationId: getV1GetExecutionDetails
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: graph_exec_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Exec Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GraphExecution'
                - $ref: '#/components/schemas/GraphExecutionWithNodes'
                title: Response Getv1Get Execution Details
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV1Get execution details
  /api/graphs/{graph_id}/executions/{graph_exec_id}/stop:
    post:
      tags:
      - Graphs
      summary: Stop graph execution
      operationId: postV1StopGraphExecution
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: graph_exec_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Exec Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GraphExecutionMeta'
                - type: 'null'
                title: Response Postv1Stop Graph Execution
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV1Stop graph execution
  /api/graphs/{graph_id}/settings:
    patch:
      tags:
      - Graphs
      summary: Update graph settings
      description: Update graph settings for the user's library agent.
      operationId: patchV1UpdateGraphSettings
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphSettings'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSettings'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: patchV1Update graph settings
  /api/graphs/{graph_id}/versions:
    get:
      tags:
      - Graphs
      summary: Get all graph versions
      operationId: getV1GetAllGraphVersions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphModel'
                title: Response Getv1Get All Graph Versions
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV1Get all graph versions
  /api/graphs/{graph_id}/versions/active:
    put:
      tags:
      - Graphs
      summary: Set active graph version
      operationId: putV1SetActiveGraphVersion
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGraphActiveVersion'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetActiveGraphVersionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: putV1Set active graph version
  /api/graphs/{graph_id}/versions/{version}:
    get:
      tags:
      - Graphs
      summary: Get graph version
      operationId: getV1GetGraphVersion
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: version
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      - name: for_export
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: For Export
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphModel'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV1Get graph version
  /api/public/shared/{share_token}/files/{file_id}/download:
    get:
      tags:
      - Graphs
      summary: Download a file from a shared execution
      description: 'Download a workspace file from a shared execution (no auth required).


        Validates that the file was explicitly exposed when sharing was enabled.

        Returns a uniform 404 for all failure modes to prevent enumeration attacks.'
      operationId: download_shared_file
      parameters:
      - name: share_token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: Share Token
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/graphs:
    post:
      tags:
      - Graphs
      summary: Create Graph
      description: 'Create a new agent graph.


        The graph will be validated and assigned a new ID.

        It is automatically added to the user''s library.'
      operationId: create_graph_v1_graphs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Graph'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
    servers:
    - url: /external-api
  /v1/graphs/{graph_id}/execute/{graph_version}:
    post:
      tags:
      - Graphs
      summary: Execute Graph
      operationId: execute_graph_v1_graphs__graph_id__execute__graph_version__post
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: graph_version
        in: path
        required: true
        schema:
          type: integer
          title: Graph Version
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_execute_graph_v1_graphs__graph_id__execute__graph_version__post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Execute Graph V1 Graphs  Graph Id  Execute  Graph Version  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: /external-api
  /v1/graphs/{graph_id}/executions/{graph_exec_id}/results:
    get:
      tags:
      - Graphs
      summary: Get Graph Execution Results
      operationId: get_graph_execution_results_v1_graphs__graph_id__executions__graph_exec_id__results_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: graph_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Id
      - name: graph_exec_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Exec Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphExecutionResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: /external-api
components:
  responses:
    HTTP401NotAuthenticatedError:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ShareRequest:
      properties: {}
      type: object
      title: ShareRequest
      description: Optional request body for share endpoint.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    backend__api__features__v1__ShareResponse:
      properties:
        share_url:
          type: string
          title: Share Url
        share_token:
          type: string
          title: Share Token
      type: object
      required:
      - share_url
      - share_token
      title: ShareResponse
      description: Response from share endpoints.
    GraphTriggerInfo:
      properties:
        provider:
          type: string
          title: Provider
          description: Provider name for integrations. Can be any string value, including custom provider names.
        config_schema:
          additionalProperties: true
          type: object
          title: Config Schema
          description: Input schema for the trigger block
        credentials_input_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Credentials Input Name
      type: object
      required:
      - provider
      - config_schema
      - credentials_input_name
      title: GraphTriggerInfo
    GraphSettings:
      properties:
        human_in_the_loop_safe_mode:
          type: boolean
          title: Human In The Loop Safe Mode
          default: true
        sensitive_action_safe_mode:
          type: boolean
          title: Sensitive Action Safe Mode
          default: false
        builder_chat_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Builder Chat Session Id
      type: object
      title: GraphSettings
    Node:
      properties:
        id:
          type: string
          title: Id
        block_id:
          type: string
          title: Block Id
        input_default:
          additionalProperties: true
          type: object
          title: Input Default
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        input_links:
          items:
            $ref: '#/components/schemas/Link'
          type: array
          title: Input Links
        output_links:
          items:
            $ref: '#/components/schemas/Link'
          type: array
          title: Output Links
      type: object
      required:
      - block_id
