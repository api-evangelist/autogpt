openapi: 3.2.0
info:
  title: AutoGPT Agent Server V1 API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: v1
paths:
  /api/api-keys:
    get:
      tags:
      - v1
      summary: List user API keys
      description: List all API keys for the user
      operationId: getV1List user api keys
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/APIKeyInfo'
                type: array
                title: Response Getv1List User Api Keys
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
    post:
      tags:
      - v1
      summary: Create new API key
      description: Create a new API key
      operationId: postV1Create new api key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/api-keys/{key_id}:
    delete:
      tags:
      - v1
      summary: Revoke API key
      description: Revoke an API key
      operationId: deleteV1Revoke api key
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyInfo'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - v1
      summary: Get specific API key
      description: Get a specific API key
      operationId: getV1Get specific api key
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyInfo'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/api-keys/{key_id}/permissions:
    put:
      tags:
      - v1
      summary: Update key permissions
      description: Update API key permissions
      operationId: putV1Update key permissions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyInfo'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/api-keys/{key_id}/suspend:
    post:
      tags:
      - v1
      summary: Suspend API key
      description: Suspend an API key
      operationId: postV1Suspend api key
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyInfo'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/user:
    post:
      tags:
      - v1
      summary: Get or create user
      operationId: postV1Get or create user
      responses:
        '200':
          description: Successful Response
          headers:
            X-AutoGPT-User-Created:
              description: Whether this request created a new user
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/auth/user/email:
    post:
      tags:
      - v1
      summary: Update user email
      operationId: postV1Update user email
      requestBody:
        content:
          application/json:
            schema:
              type: string
              title: Email
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Postv1Update User Email
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/auth/user/preferences:
    get:
      tags:
      - v1
      summary: Get notification preferences
      operationId: getV1Get notification preferences
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
    post:
      tags:
      - v1
      summary: Update notification preferences
      operationId: postV1Update notification preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceDTO'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/auth/user/preferences/from-email:
    post:
      tags:
      - v1
      summary: Apply a volume-knob choice from a Briefing footer link
      description: 'Apply one footer choice, authorised by the token in the link.


        Deliberately not `Security(requires_user)`. The session is the wrong

        authority here: the settings page applies this on arrival, so a

        session-authenticated write would let any third party change a logged-in

        reader''s preferences just by getting them to follow a link. The HMAC binds

        the choice to the recipient we sent it to, exactly as the unsubscribe link

        does, and works whether or not they happen to be signed in.'
      operationId: postV1Apply a volume-knob choice from a briefing footer link
      parameters:
      - name: choice
        in: query
        required: true
        schema:
          type: string
          title: Choice
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/user/timezone:
    get:
      tags:
      - v1
      summary: Get user timezone
      description: Get user timezone setting.
      operationId: getV1Get user timezone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
    post:
      tags:
      - v1
      summary: Update user timezone
      description: Update user timezone. The timezone should be a valid IANA timezone identifier.
      operationId: postV1Update user timezone
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTimezoneRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/blocks:
    get:
      tags:
      - v1
      summary: List available blocks
      operationId: getV1List available blocks
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Getv1List Available Blocks
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/blocks/{block_id}/execute:
    post:
      tags:
      - v1
      summary: Execute graph block
      operationId: postV1Execute graph block
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: block_id
        in: path
        required: true
        schema:
          type: string
          title: Block Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Data
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: {}
                title: Response Postv1Execute Graph Block
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '402':
          description: Subscription required (NO_TIER user, paywall on)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/credits:
    get:
      tags:
      - v1
      summary: Get user credits
      operationId: getV1Get user credits
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: integer
                type: object
                title: Response Getv1Get User Credits
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
    patch:
      tags:
      - v1
      summary: Fulfill checkout session
      operationId: patchV1Fulfill checkout session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
    post:
      tags:
      - v1
      summary: Request credit top up
      operationId: postV1Request credit top up
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestTopUp'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/credits/auto-top-up:
    get:
      tags:
      - v1
      summary: Get auto top up
      operationId: getV1Get auto top up
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTopUpConfig'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
    post:
      tags:
      - v1
      summary: Configure auto top up
      description: 'Configure auto top-up settings and perform an immediate top-up if needed.


        Raises HTTPException(422) if the request parameters are invalid or if

        the credit top-up fails.'
      operationId: postV1Configure auto top up
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoTopUpConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Postv1Configure Auto Top Up
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/credits/invoices:
    get:
      tags:
      - v1
      summary: List Stripe invoices
      description: 'Recent Stripe invoices for the current user.


        Each item includes ``hosted_invoice_url`` (Stripe-hosted view) and

        ``invoice_pdf_url`` (direct PDF download). Returns an empty list when

        the credit system is disabled or the user has no Stripe customer yet.'
      operationId: getV1List stripe invoices
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 24
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceListItem'
                title: Response Getv1List Stripe Invoices
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/credits/manage:
    get:
      tags:
      - v1
      summary: Manage payment methods
      operationId: getV1Manage payment methods
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Getv1Manage Payment Methods
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/credits/refunds:
    get:
      tags:
      - v1
      summary: Get refund requests
      operationId: getV1Get refund requests
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RefundRequest'
                type: array
                title: Response Getv1Get Refund Requests
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/credits/stripe_webhook:
    post:
      tags:
      - v1
      summary: Handle Stripe webhooks
      operationId: postV1Handle stripe webhooks
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/credits/subscription:
    get:
      tags:
      - v1
      summary: Get subscription tier, current cost, and all tier costs
      operationId: getSubscriptionStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatusResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
    post:
      tags:
      - v1
      summary: Update subscription tier or start a Stripe Checkout session
      operationId: updateSubscriptionTier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionTierRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatusResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/credits/transactions:
    get:
      tags:
      - v1
      summary: Get credit history
      operationId: getV1Get credit history
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: transaction_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Transaction Time
      - name: transaction_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction Type
      - name: transaction_count_limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Transaction Count Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistory'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/credits/{transaction_key}/refund:
    post:
      tags:
      - v1
      summary: Refund credit transaction
      operationId: postV1Refund credit transaction
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: transaction_key
        in: path
        required: true
        schema:
          type: string
          title: Transaction Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              title: Metadata
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: integer
                title: Response Postv1Refund Credit Transaction
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/email/:
    post:
      tags:
      - v1
      summary: Handle Postmark Email Webhooks
      operationId: postV1Handle postmark email webhooks
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PostmarkDeliveryWebhook'
              - $ref: '#/components/schemas/PostmarkBounceWebhook'
              - $ref: '#/components/schemas/PostmarkSpamComplaintWebhook'
              - $ref: '#/components/schemas/PostmarkOpenWebhook'
              - $ref: '#/components/schemas/PostmarkClickWebhook'
              - $ref: '#/components/schemas/PostmarkSubscriptionChangeWebhook'
              title: Webhook
              discriminator:
                propertyName: RecordType
                mapping:
                  Delivery: '#/components/schemas/PostmarkDeliveryWebhook'
                  Bounce: '#/components/schemas/PostmarkBounceWebhook'
                  SpamComplaint: '#/components/schemas/PostmarkSpamComplaintWebhook'
                  Open: '#/components/schemas/PostmarkOpenWebhook'
                  Click: '#/components/schemas/PostmarkClickWebhook'
                  SubscriptionChange: '#/components/schemas/PostmarkSubscriptionChangeWebhook'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyAuthenticator-X-Postmark-Webhook-Token: []
  /api/email/unsubscribe:
    post:
      tags:
      - v1
      summary: One Click Email Unsubscribe
      operationId: postV1One click email unsubscribe
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/executions:
    get:
      tags:
      - v1
      summary: List all executions
      operationId: getV1List all executions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphExecutionMeta'
                type: array
                title: Response Getv1List All Executions
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/executions/cost-summary:
    get:
      tags:
      - v1
      summary: User cost summary
      description: Aggregated cost breakdown for the calling user's graph executions.
      operationId: getV1User cost summary
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Window start (UTC). Defaults to start of current calendar month.
          title: Since
        description: Window start (UTC). Defaults to start of current calendar month.
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Window end (UTC). Defaults to now.
          title: Until
        description: Window end (UTC). Defaults to now.
      - name: top_runs_limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Maximum number of top-cost runs to return.
          default: 10
          title: Top Runs Limit
        description: Maximum number of top-cost runs to return.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExecutionCostSummary'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/executions/{graph_exec_id}:
    delete:
      tags:
      - v1
      summary: Delete graph execution
      operationId: deleteV1Delete graph execution
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_exec_id
        in: path
        required: true
        schema:
          type: string
          title: Graph Exec Id
      responses:
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/upload:
    post:
      tags:
      - v1
      summary: Upload file to cloud storage
      description: 'Upload a file to cloud storage and return a storage key that can be used

        with FileStoreBlock and AgentFileInputBlock.


        Args:

        file: The file to upload

        user_id: The user ID

        provider: Cloud storage provider ("gcs", "s3", "azure")

        expiration_hours: Hours until file expires (1-48)


        Returns:

        Dict containing the cloud storage path and signed URL'
      operationId: postV1Upload file to cloud storage
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: expiration_hours
        in: query
        required: false
        schema:
          type: integer
          default: 24
          title: Expiration Hours
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_postV1Upload_file_to_cloud_storage'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
