        returns 400. Missing skills return 404 so the UI can reconcile a

        stale list.'
      operationId: deleteCopilotSkill
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          description: Slug of the skill to delete
          title: Name
        description: Slug of the skill to delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Deletecopilotskill
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - v1
      summary: Read a single copilot skill with its full SKILL.md body
      description: 'Return full SKILL.md content (name, description, triggers, body)

        for the library UI''s expand-to-view dialog.


        Built-in default skills are returned with ``is_default=True`` so the

        UI can hide destructive affordances; missing user skills return 404.'
      operationId: readCopilotSkill
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          description: Slug of the skill to read
          title: Name
        description: Slug of the skill to read
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotSkillDetail'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Skill not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
