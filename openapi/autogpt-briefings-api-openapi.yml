openapi: 3.2.0
info:
  title: AutoGPT Agent Server Briefings API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: briefings
paths:
  /api/briefings/latest:
    get:
      tags:
      - briefings
      summary: Get Latest Briefing
      description: 'Return the user''s current briefing, or None if there isn''t a fresh one.


        Only briefings covering today or yesterday qualify; anything older is

        history, not "this morning".


        Stored content that fails to validate against the current BriefingContent

        shape (e.g. written by an older/newer version of the composer) is skipped

        rather than 500ing the request — and rather than hiding every older

        briefing behind one unreadable row on the newest date.'
      operationId: getBriefingsGet latest briefing
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BriefingResponse'
                - type: 'null'
                title: Response Getbriefingsget Latest Briefing
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
components:
  schemas:
    BriefingResponse:
      properties:
        id:
          type: string
          title: Id
        briefing_date:
          type: string
          format: date
          title: Briefing Date
        created_at:
          type: string
          format: date-time
          title: Created At
        delivered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Delivered At
        content:
          $ref: '#/components/schemas/BriefingContent'
      type: object
      required:
      - id
      - briefing_date
      - created_at
      - delivered_at
      - content
      title: BriefingResponse
    BriefingContent:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
        timezone:
          type: string
          title: Timezone
        zero_expert_fallback:
          type: boolean
          title: Zero Expert Fallback
        run_items:
          items:
            $ref: '#/components/schemas/BriefingRunItem'
          type: array
          title: Run Items
        decision_items:
          items:
            $ref: '#/components/schemas/BriefingDecisionItem'
          type: array
          title: Decision Items
        decision_total:
          type: integer
          minimum: 0.0
          title: Decision Total
          default: 0
        completed_total:
          type: integer
          minimum: 0.0
          title: Completed Total
          default: 0
        failed_total:
          type: integer
          minimum: 0.0
          title: Failed Total
          default: 0
        narrative:
          anyOf:
          - type: string
          - type: 'null'
          title: Narrative
      type: object
      required:
      - generated_at
      - timezone
      - zero_expert_fallback
      - run_items
      - decision_items
      title: BriefingContent
    BriefingRunItem:
      properties:
        expert_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Id
        expert_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Name
        expert_avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Avatar Url
        agent_name:
          type: string
          title: Agent Name
        graph_id:
          type: string
          title: Graph Id
        execution_id:
          type: string
          title: Execution Id
        library_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Library Agent Id
        status:
          type: string
          title: Status
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
        expert_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Role
        title:
          type: string
          title: Title
          default: ''
        detail:
          type: string
          title: Detail
          default: ''
        occurred_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Occurred At
        duration_seconds:
          type: number
          title: Duration Seconds
          default: 0
        cost_cents:
          type: integer
          title: Cost Cents
          default: 0
      type: object
      required:
      - expert_id
      - expert_name
      - expert_avatar_url
      - agent_name
      - graph_id
      - execution_id
      - library_agent_id
      - status
      - summary
      - link
      title: BriefingRunItem
    BriefingDecisionItem:
      properties:
        node_exec_id:
          type: string
          title: Node Exec Id
        graph_exec_id:
          type: string
          title: Graph Exec Id
        title:
          type: string
          title: Title
        expert_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Id
        expert_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Name
        expert_avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Expert Avatar Url
        link:
          type: string
          title: Link
      type: object
      required:
      - node_exec_id
      - graph_exec_id
      - title
      - expert_id
      - expert_name
      - expert_avatar_url
      - link
      title: BriefingDecisionItem
  responses:
    HTTP401NotAuthenticatedError:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
  securitySchemes:
    APIKeyAuthenticator-X-Postmark-Webhook-Token:
      type: apiKey
      in: header
      name: X-Postmark-Webhook-Token
    HTTPBearer:
      type: http
      scheme: bearer
    HTTPBearerJWT:
      type: http
      scheme: bearer
      bearerFormat: jwt
