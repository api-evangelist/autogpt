openapi: 3.2.0
info:
  title: AutoGPT Agent Server Public API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: Public
paths:
  /api/public/shared/{share_token}:
    get:
      tags:
      - Public
      summary: Get Shared Execution
      description: Get a shared graph execution by share token (no auth required).
      operationId: getV1GetSharedExecution
      parameters:
      - name: share_token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: Share Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedExecutionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AgentExecutionStatus:
      type: string
      enum:
      - INCOMPLETE
      - QUEUED
      - RUNNING
      - COMPLETED
      - TERMINATED
      - FAILED
      - REVIEW
      title: AgentExecutionStatus
    SharedExecutionResponse:
      properties:
        id:
          type: string
          title: Id
        graph_name:
          type: string
          title: Graph Name
        graph_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Graph Description
        status:
          $ref: '#/components/schemas/AgentExecutionStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
        outputs:
          additionalProperties:
            items: {}
            type: array
          type: object
          title: Outputs
      type: object
      required:
      - id
      - graph_name
      - graph_description
      - status
      - created_at
      - outputs
      title: SharedExecutionResponse
      description: Public-safe response for shared executions
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyAuthenticator-X-Postmark-Webhook-Token:
      type: apiKey
      in: header
      name: X-Postmark-Webhook-Token
    HTTPBearer:
      type: http
      scheme: bearer
    HTTPBearerJWT:
      type: http
      scheme: bearer
      bearerFormat: jwt
