    StreamChatRequest:
      properties:
        message:
          type: string
          maxLength: 64000
          title: Message
        is_user_message:
          type: boolean
          title: Is User Message
          default: true
        context:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Context
