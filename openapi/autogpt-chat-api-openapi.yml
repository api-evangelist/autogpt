          - type: 'null'
          title: Session Id
        presets:
          items:
            $ref: '#/components/schemas/PresetSummary'
          type: array
          title: Presets
        total_count:
          type: integer
          title: Total Count
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
      type: object
      required:
