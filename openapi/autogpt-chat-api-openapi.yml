          anyOf:
          - type: string
            enum:
            - fast
            - extended_thinking
          - type: 'null'
          title: Mode
          description: 'Autopilot mode: ''fast'' for baseline LLM, ''extended_thinking'' for Claude Agent SDK. If None, uses the server default (extended_thinking).'
        model:
          anyOf:
          - type: string
            enum:
            - standard
            - advanced
          - type: 'null'
          title: Model
          description: 'Model tier: ''standard'' for the default model, ''advanced'' for the highest-capability model. If None, the server applies per-user LD targeting then falls back to config.'
        message_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Message Id
          description: Optional per-click UUID generated by the frontend. The server scopes it to the authenticated user and session before using the result as ``ChatMessage.id``. Frontend / network / RMQ-redelivery retransmits of the same logical send reuse the key, so the Postgres unique-constraint on the resulting PK is the atomic dedup primitive. A duplicate INSERT returns a subscribe-only response without creating a parallel turn. Distinct user clicks (even with identical text) MUST send different ids — the frontend's per-click ``crypto.randomUUID()`` guarantees that.
        expert_kickoff:
          type: boolean
          title: Expert Kickoff
          description: Marks the hidden, once-per-expert day-one kickoff. The server derives its owner-scoped message ID and persistence metadata.
