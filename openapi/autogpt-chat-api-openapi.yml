openapi: 3.2.0
info:
  title: AutoGPT Agent Server Chat API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: Chat
paths:
  /api/chat/config/ttl:
    get:
      tags:
      - Chat
      summary: Get Ttl Config
      description: 'Get the stream TTL configuration.


        Returns the Time-To-Live settings for chat streams, which determines

        how long clients can reconnect to an active stream.


        Returns:

        dict: TTL configuration with seconds and milliseconds values.'
      operationId: getV2GetTtlConfig
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Getv2Getttlconfig
  /api/chat/health:
    get:
      tags:
      - Chat
      summary: Health Check
      description: 'Health check endpoint for the chat service.


        Performs a full cycle test of session creation and retrieval. Should always return healthy

        if the service and data layer are operational.


        Returns:

        dict: A status dictionary indicating health, service name, and API version.'
      operationId: getV2HealthCheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Getv2Healthcheck
  /api/chat/schema/tool-responses:
    get:
      tags:
      - Chat
      summary: '[Dummy] Tool response type export for codegen'
      description: This endpoint is not meant to be called. It exists solely to expose tool response models in the OpenAPI schema for frontend codegen.
      operationId: getV2[dummy]ToolResponseTypeExportForCodegen
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AgentsFoundResponse'
                - $ref: '#/components/schemas/NoResultsResponse'
                - $ref: '#/components/schemas/AgentDetailsResponse'
                - $ref: '#/components/schemas/SetupRequirementsResponse'
                - $ref: '#/components/schemas/ExecutionStartedResponse'
                - $ref: '#/components/schemas/NeedLoginResponse'
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/InputValidationErrorResponse'
                - $ref: '#/components/schemas/AgentOutputResponse'
                - $ref: '#/components/schemas/UnderstandingUpdatedResponse'
                - $ref: '#/components/schemas/AgentPreviewResponse'
                - $ref: '#/components/schemas/AgentSavedResponse'
                - $ref: '#/components/schemas/ClarificationNeededResponse'
                - $ref: '#/components/schemas/SuggestedGoalResponse'
                - $ref: '#/components/schemas/BlockListResponse'
                - $ref: '#/components/schemas/BlockDetailsResponse'
                - $ref: '#/components/schemas/BlockOutputResponse'
                - $ref: '#/components/schemas/DocSearchResultsResponse'
                - $ref: '#/components/schemas/DocPageResponse'
                - $ref: '#/components/schemas/MCPToolsDiscoveredResponse'
                - $ref: '#/components/schemas/MCPToolOutputResponse'
                - $ref: '#/components/schemas/TaskDecompositionResponse'
                - $ref: '#/components/schemas/ScheduleListResponse'
                - $ref: '#/components/schemas/ScheduleDeletedResponse'
                - $ref: '#/components/schemas/PresetListResponse'
                - $ref: '#/components/schemas/PresetUpdatedResponse'
                - $ref: '#/components/schemas/PresetDeletedResponse'
                - $ref: '#/components/schemas/MemoryStoreResponse'
                - $ref: '#/components/schemas/MemorySearchResponse'
                - $ref: '#/components/schemas/MemoryForgetCandidatesResponse'
                - $ref: '#/components/schemas/MemoryForgetConfirmResponse'
                - $ref: '#/components/schemas/TodoWriteResponse'
                - $ref: '#/components/schemas/ExpertSoulUpdatedResponse'
                title: Response Getv2[Dummy] Tool Response Type Export For Codegen
      x-operation-id-source: normalized
      x-operation-id-original: getV2[dummy] tool response type export for codegen
  /api/chat/sessions:
    get:
      tags:
      - Chat
      summary: List Sessions
      description: 'List chat sessions for the authenticated user.


        Returns a paginated list of chat sessions belonging to the current user,

        with pinned sessions first and most-recently-updated as the tiebreaker.


        Args:

        user_id: The authenticated user''s ID.

        limit: Maximum number of sessions to return (1-100).

        offset: Number of sessions to skip for pagination.

        expert_id: Restrict the listing to sessions scoped to this expert.

        pinned_first: Whether pinned sessions precede strict recency ordering.


        Returns:

        ListSessionsResponse: List of session summaries and total count.'
      operationId: getV2ListSessions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: expert_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
          title: Expert Id
      - name: pinned_first
        in: query
        required: false
        schema:
          type: boolean
          description: Keep pinned sessions before recent sessions. Set false for strict recency when adopting the latest expert thread.
          default: true
          title: Pinned First
        description: Keep pinned sessions before recent sessions. Set false for strict recency when adopting the latest expert thread.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Chat
      summary: Create Session
      description: 'Create (or get-or-create) a chat session.


        Two modes, selected by the request body:


        - Default: create a fresh session for the user. ``dry_run=True`` forces

        run_block and run_agent calls to use dry-run simulation.

        - Builder-bound: when ``builder_graph_id`` is set, get-or-create keyed

        on ``(user_id, builder_graph_id)``. Returns the existing session for

        that graph or creates one locked to it. Graph ownership is validated

        inside :func:`get_or_create_builder_session`; raises 404 on

        unauthorized access. Write-side scope is enforced per-tool

        (``edit_agent`` / ``run_agent`` reject any ``agent_id`` other than

        the bound graph) and a small blacklist hides tools that conflict

        with the panel''s scope (see :data:`BUILDER_BLOCKED_TOOLS`).

        - Expert kickoff: atomically create or adopt the canonical first session

        for ``(user_id, expert_id)``.


        Args:

        user_id: The authenticated user ID parsed from the JWT (required).

        request: Optional request body with ``dry_run``,

        ``builder_graph_id`` and/or ``expert_id``.


        Returns:

        CreateSessionResponse: Details of the resulting session.'
      operationId: postV2CreateSession
      security:
      - HTTPBearerJWT: []
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateSessionRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/sessions/{session_id}:
    delete:
      tags:
      - Chat
      summary: Delete Session
      description: 'Delete a chat session.


        Permanently removes a chat session and all its messages.

        Only the owner can delete their sessions.


        Args:

        session_id: The session ID to delete.

        user_id: The authenticated user''s ID.


        Returns:

        204 No Content on success.


        Raises:

        HTTPException: 404 if session not found or not owned by user.'
      operationId: deleteV2DeleteSession
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Session not found or access denied
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Chat
      summary: Get Session
      description: 'Retrieve the details of a specific chat session.


        Supports cursor-based pagination via ``limit`` and ``before_sequence``.

        When no pagination params are provided, returns the most recent messages.'
      operationId: getV2GetSession
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: before_sequence
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Before Sequence
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/sessions/{session_id}/assign-user:
    patch:
      tags:
      - Chat
      summary: Session Assign User
      description: 'Assign an authenticated user to a chat session.


        Used (typically post-login) to claim an existing anonymous session as the current authenticated user.


        Args:

        session_id: The identifier for the (previously anonymous) session.

        user_id: The authenticated user''s ID to associate with the session.


        Returns:

        dict: Status of the assignment.'
      operationId: patchV2SessionAssignUser
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patchv2Sessionassignuser
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/sessions/{session_id}/cancel:
    post:
      tags:
      - Chat
      summary: Cancel Session Task
      description: 'Cancel an in-flight task for a session.


        Handles both lifecycle states uniformly:


        * **Queued** (``chatStatus=''queued''``) — the dispatcher hasn''t

        claimed the row yet. Flip the session back to ``idle`` and

        return; no executor cancel event needed.

        * **Running** (``chatStatus=''running''``) — publish a cancel event

        to the executor via RabbitMQ FANOUT, then poll Redis until the

        task status flips out of ``running`` or a 5 s timeout is hit.'
      operationId: postV2CancelSessionTask
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSessionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/sessions/{session_id}/messages/pending:
    get:
      tags:
      - Chat
      summary: Get Pending Messages
      description: 'Peek at the pending-message buffer without consuming it.


        Returns the current contents of the session''s pending message buffer

        so the frontend can restore the queued-message indicator after a page

        refresh and clear it correctly once a turn drains the buffer.'
      operationId: getV2GetPendingMessages
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeekPendingMessagesResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Session not found or access denied
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Chat
      summary: Queue Pending Message
      description: Queue a follow-up message while the session has an active turn.
      operationId: postV2QueuePendingMessage
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueuePendingMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePendingMessageResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Session not found or access denied
        '409':
          description: Session has no active turn to receive pending messages
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Call-frequency cap exceeded
        '503':
          description: Chat service degraded (Redis unavailable); client should honour the Retry-After header before retrying.
  /api/chat/sessions/{session_id}/pinned:
    patch:
      tags:
      - Chat
      summary: Update session pinned
      description: 'Pin or unpin a chat session.


        Pinned sessions surface at the top of the user''s sidebar list ahead of

        unpinned ones, regardless of recency.


        Args:

        session_id: The session ID to update.

        request: Request body containing the new pin state.

        user_id: The authenticated user''s ID.


        Returns:

        dict: Status of the update.


        Raises:

        HTTPException: 404 if session not found or not owned by user.'
      operationId: patchV2UpdateSessionPinned
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionPinnedRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patchv2Update Session Pinned
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Session not found or access denied
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: patchV2Update session pinned
  /api/chat/sessions/{session_id}/share:
    delete:
      tags:
      - Chat
      summary: Disable Chat Sharing
      description: 'Revoke sharing for a chat session.


        Cascade-revokes linked executions whose share originated here

        (``sharedVia == CHAT_LINK``). User-initiated execution shares

        survive — see :func:`backend.copilot.sharing.db.disable_chat_session_share`.'
      operationId: deleteV2DisableChatSharing
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Chat
      summary: Enable Chat Sharing
      description: 'Enable sharing for a chat session.


        Flag-gated: refuses with 403 when ``chat-sharing`` is off so a stale

        frontend cannot enable shares post-rollback.'
      operationId: postV2EnableChatSharing
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableShareRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/backend__api__features__chat__share__ShareResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '403':
          description: Chat sharing is not enabled for this user
        '404':
          description: Chat session not found for user
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/sessions/{session_id}/share/state:
    get:
      tags:
      - Chat
      summary: Get Chat Share State
      description: 'Return the chat''s current share state.


        The share modal calls this on open so it can render in the right

        mode (share-vs-revoke) and pre-select the auto-share toggle.'
      operationId: getV2GetChatShareState
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatShareStateResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/sessions/{session_id}/stream:
    delete:
      tags:
      - Chat
      summary: Disconnect Session Stream
      description: 'Disconnect all active SSE listeners for a session.


        Called by the frontend when the user switches away from a chat so the

        backend releases XREAD listeners immediately rather than waiting for

        the 5-10 s timeout.'
      operationId: deleteV2DisconnectSessionStream
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Chat
      summary: Resume Session Stream
      description: 'Resume an active stream for a session.


        Called by the AI SDK''s ``useChat(resume: true)`` on page load.

        Checks for an active (in-progress) task on the session and either replays

        the full SSE stream or returns 204 No Content if nothing is running.


        Always replays the active turn from ``0-0``. The AI SDK UI-message parser

        keeps text/reasoning part state inside a single parser instance; resuming

        from a Redis cursor can skip the ``*-start`` events required by later

        ``*-delta`` chunks.'
      operationId: getV2ResumeSessionStream
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Chat
      summary: Stream Chat Post
      description: 'Start a new turn and return an AI SDK UI message stream.


        Returns an SSE stream (``text/event-stream``) with Vercel AI SDK chunks

        (text fragments, tool-call UI, tool results). The generation runs in a

        background task that survives client disconnects; reconnect via

        ``GET /sessions/{session_id}/stream`` to resume.


        Follow-up messages typed while a turn is already running should use

        ``POST /sessions/{session_id}/messages/pending``. If an older client still

        posts that follow-up here, we queue it defensively but still return a valid

        empty UI-message stream so AI SDK transports never receive a JSON body from

        the stream endpoint.


        Args:

        session_id: The chat session identifier.

        request: Request body with message, is_user_message, and optional context.

        user_id: Authenticated user ID.'
      operationId: postV2StreamChatPost
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '402':
          description: Subscription required (NO_TIER user, paywall on)
        '404':
          description: Session not found or access denied
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Cost rate-limit, call-frequency cap, or per-user concurrent-turn limit exceeded
        '503':
          description: Chat service degraded (Redis unavailable for rate limit or stream registry); client should honour the Retry-After header before retrying.
  /api/chat/sessions/{session_id}/title:
    patch:
      tags:
      - Chat
      summary: Update session title
      description: 'Update the title of a chat session.


        Allows the user to rename their chat session.


        Args:

        session_id: The session ID to update.

        request: Request body containing the new title.

        user_id: The authenticated user''s ID.


        Returns:

        dict: Status of the update.


        Raises:

        HTTPException: 404 if session not found or not owned by user.'
      operationId: patchV2UpdateSessionTitle
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionTitleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patchv2Update Session Title
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '404':
          description: Session not found or access denied
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: patchV2Update session title
  /api/chat/suggested-prompts:
    get:
      tags:
      - Chat
      summary: Get Suggested Prompts
      description: 'Get LLM-generated suggested prompts grouped by theme.


        Returns personalized quick-action prompts based on the user''s

        business understanding. Returns empty themes list if no custom

        prompts are available.'
      operationId: getV2GetSuggestedPrompts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedPromptsResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/chat/transports:
    get:
      tags:
      - Chat
      summary: List Chat Transports
      operationId: getV2ListChatTransports
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTransportsResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/chat/usage:
    get:
      tags:
      - Chat
      summary: Get Copilot Usage
      description: 'Get CoPilot usage status for the authenticated user.


        Returns the percentage of the daily/weekly allowance used — not the

        raw spend or cap — so clients cannot derive per-turn cost or platform

        margins. Global defaults sourced from LaunchDarkly (falling back to

        config). Includes the user''s rate-limit tier.'
      operationId: getV2GetCopilotUsage
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoPilotUsagePublic'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/chat/usage/reset:
    post:
      tags:
      - Chat
      summary: Reset Copilot Usage
      description: 'Reset the daily CoPilot rate limit by spending credits.


        Allows users who have hit their daily cost limit to spend credits

        to reset their daily usage counter and continue working.

        Returns 400 if the feature is disabled or the user is not over the limit.

        Returns 402 if the user has insufficient credits.'
      operationId: postV2ResetCopilotUsage
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResetResponse'
        '400':
          description: Bad Request (feature disabled or daily limit not reached)
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '402':
          description: Payment Required (insufficient credits)
        '429':
          description: Too Many Requests (max daily resets exceeded or reset in progress)
        '503':
          description: Service Unavailable (Redis reset failed; credits refunded or support needed)
      security:
      - HTTPBearerJWT: []
  /api/public/shared/chats/{share_token}:
    get:
      tags:
      - Chat
      summary: Get Shared Chat
      operationId: getV2GetSharedChat
      parameters:
      - name: share_token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: Share Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedChatSession'
        '404':
          description: Shared chat not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/public/shared/chats/{share_token}/files/{file_id}/download:
    get:
      tags:
      - Chat
      summary: Download a file from a shared chat
      description: 'Download a workspace file allowlisted by a shared chat (no auth).


        Returns uniform 404 for every failure mode to prevent enumeration —

        indistinguishable from "unknown token" or "wrong file id".'
      operationId: download_shared_chat_file
      parameters:
      - name: share_token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: Share Token
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Uniform 404 for every failure mode (unknown token, wrong file id, file no longer present) — prevents enumeration.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/public/shared/chats/{share_token}/messages:
    get:
      tags:
      - Chat
      summary: Get Shared Chat Messages
      operationId: getV2GetSharedChatMessages
      parameters:
      - name: share_token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: Share Token
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: before_sequence
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Before Sequence
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedChatMessagesPage'
        '400':
          description: Invalid limit (must be 1..200)
        '404':
          description: Shared chat not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
