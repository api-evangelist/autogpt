  /api/chat/sessions/{session_id}/stream:
    delete:
      tags:
      - v2
      summary: Disconnect Session Stream
      description: 'Disconnect all active SSE listeners for a session.


        Called by the frontend when the user switches away from a chat so the

        backend releases XREAD listeners immediately rather than waiting for

        the 5-10 s timeout.'
      operationId: deleteV2DisconnectSessionStream
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - v2
      summary: Resume Session Stream
      description: 'Resume an active stream for a session.


        Called by the AI SDK''s ``useChat(resume: true)`` on page load.

        Checks for an active (in-progress) task on the session and either replays

        the full SSE stream or returns 204 No Content if nothing is running.


        Always replays the active turn from ``0-0``. The AI SDK UI-message parser

        keeps text/reasoning part state inside a single parser instance; resuming

        from a Redis cursor can skip the ``*-start`` events required by later

        ``*-delta`` chunks.'
      operationId: getV2ResumeSessionStream
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - v2
      summary: Stream Chat Post
      description: 'Start a new turn and return an AI SDK UI message stream.


        Returns an SSE stream (``text/event-stream``) with Vercel AI SDK chunks

        (text fragments, tool-call UI, tool results). The generation runs in a

        background task that survives client disconnects; reconnect via

        ``GET /sessions/{session_id}/stream`` to resume.


        Follow-up messages typed while a turn is already running should use

        ``POST /sessions/{session_id}/messages/pending``. If an older client still

        posts that follow-up here, we queue it defensively but still return a valid

        empty UI-message stream so AI SDK transports never receive a JSON body from

        the stream endpoint.


        Args:

        session_id: The chat session identifier.

        request: Request body with message, is_user_message, and optional context.

        user_id: Authenticated user ID.'
      operationId: postV2StreamChatPost
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '402':
          description: Subscription required (NO_TIER user, paywall on)
        '404':
          description: Session not found or access denied
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Cost rate-limit, call-frequency cap, or per-user concurrent-turn limit exceeded
        '503':
          description: Chat service degraded (Redis unavailable for rate limit or stream registry); client should honour the Retry-After header before retrying.
