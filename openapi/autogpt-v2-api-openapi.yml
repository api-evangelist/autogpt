  /api/chat/sessions:
    get:
      tags:
      - v2
      summary: List Sessions
      description: 'List chat sessions for the authenticated user.


        Returns a paginated list of chat sessions belonging to the current user,

        with pinned sessions first and most-recently-updated as the tiebreaker.


        Args:

        user_id: The authenticated user''s ID.

        limit: Maximum number of sessions to return (1-100).

        offset: Number of sessions to skip for pagination.

        expert_id: Restrict the listing to sessions scoped to this expert.

        pinned_first: Whether pinned sessions precede strict recency ordering.


        Returns:

        ListSessionsResponse: List of session summaries and total count.'
      operationId: getV2ListSessions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: expert_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
          title: Expert Id
      - name: pinned_first
        in: query
        required: false
        schema:
          type: boolean
          description: Keep pinned sessions before recent sessions. Set false for strict recency when adopting the latest expert thread.
          default: true
          title: Pinned First
        description: Keep pinned sessions before recent sessions. Set false for strict recency when adopting the latest expert thread.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - v2
      summary: Create Session
      description: 'Create (or get-or-create) a chat session.


        Two modes, selected by the request body:


        - Default: create a fresh session for the user. ``dry_run=True`` forces

        run_block and run_agent calls to use dry-run simulation.

        - Builder-bound: when ``builder_graph_id`` is set, get-or-create keyed

        on ``(user_id, builder_graph_id)``. Returns the existing session for

        that graph or creates one locked to it. Graph ownership is validated

        inside :func:`get_or_create_builder_session`; raises 404 on

        unauthorized access. Write-side scope is enforced per-tool

        (``edit_agent`` / ``run_agent`` reject any ``agent_id`` other than

        the bound graph) and a small blacklist hides tools that conflict

        with the panel''s scope (see :data:`BUILDER_BLOCKED_TOOLS`).

        - Expert kickoff: atomically create or adopt the canonical first session

        for ``(user_id, expert_id)``.


        Args:

        user_id: The authenticated user ID parsed from the JWT (required).

        request: Optional request body with ``dry_run``,

        ``builder_graph_id`` and/or ``expert_id``.


        Returns:

        CreateSessionResponse: Details of the resulting session.'
      operationId: postV2CreateSession
      security:
      - HTTPBearerJWT: []
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateSessionRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
