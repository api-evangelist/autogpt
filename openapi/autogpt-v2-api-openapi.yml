components:
  schemas:
    AgentsFoundResponse:
      properties:
        type:
          $ref: '#/components/schemas/ResponseType'
          default: agents_found
        message:
          type: string
          title: Message
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        title:
          type: string
          title: Title
          default: Available Agents
        agents:
          items:
            $ref: '#/components/schemas/AgentInfo'
          type: array
          title: Agents
        count:
          type: integer
          title: Count
        name:
          type: string
          title: Name
          default: agents_found
      type: object
      required:
      - message
      - agents
      - count
      title: AgentsFoundResponse
      description: Response for find_agent tool.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RebuildResult:
      properties:
        user_id:
          type: string
          title: User Id
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        communities_built:
          title: Communities Built
        elapsed_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Elapsed Seconds
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        skipped:
          type: boolean
          title: Skipped
          default: false
        skip_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Skip Reason
        activity:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Activity
        forced:
          type: boolean
          title: Forced
          default: false
        execution_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Execution Path
      type: object
      required:
      - user_id
      title: RebuildResult
      description: 'Typed envelope around ``rebuild_communities_for_user``''s return dict.


        Lives here (admin routes) rather than in ``copilot/graphiti/communities.py``

        because the dict-returning rebuild function predates the admin-API

        typing pass. Hoisting it to ``communities.py`` (and changing the

        function signature) is a follow-up cleanup.'
