    CreateSessionRequest:
      properties:
        dry_run:
          type: boolean
          title: Dry Run
          default: false
        builder_graph_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Builder Graph Id
        llm_auth_provider:
          type: string
          enum:
          - platform
          - codex
          title: Llm Auth Provider
          default: platform
        llm_credential_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Llm Credential Id
        expert_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Expert Id
        expert_kickoff:
          type: boolean
          title: Expert Kickoff
          default: false
      additionalProperties: false
      type: object
      title: CreateSessionRequest
      description: "Request model for creating (or get-or-creating) a chat session.\n\nTwo modes, selected by the body:\n\n- Default: create a fresh session. ``dry_run`` is a **top-level**\n  field — do not nest it inside ``metadata``.\n- Builder-bound: when ``builder_graph_id`` is set, the endpoint\n  switches to **get-or-create** keyed on\n  ``(user_id, builder_graph_id)``.  The builder panel calls this on\n  mount so the chat persists across refreshes.  Graph ownership is\n  validated inside :func:`get_or_create_builder_session`. Write-side\n  scope is enforced per-tool (``edit_agent`` / ``run_agent`` reject\n  any ``agent_id`` other than the bound graph) and a small blacklist\n  hides tools that conflict with the panel's scope\n  (``create_agent`` / ``customize_agent`` / ``get_agent_building_guide``\n  — see :data:`BUILDER_BLOCKED_TOOLS`). Read-side lookups\n  (``find_block``, ``find_agent``, ``search_docs``, …) stay open.\n\n``expert_id`` scopes the session to a hired expert. It must reference\nan expert owned by the caller that is neither a template nor archived,\notherwise the request is rejected with 404. It is mutually exclusive\nwith ``builder_graph_id`` (422) — builder-bound sessions are never\nexpert-scoped.\n\n``expert_kickoff`` switches expert creation to an atomic create-or-adopt\nmode keyed by the authenticated user and expert. It is invalid without\n``expert_id``.\n\nExtra/unknown fields are rejected (422) to prevent silent mis-use."
