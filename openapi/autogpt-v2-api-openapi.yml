openapi: 3.2.0
info:
  title: AutoGPT Agent Server V2 API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: v2
paths:
  /api/admin/blocks/cost-estimates:
    get:
      tags:
      - v2
      summary: Export Block Cost Estimates
      description: 'Aggregate per-block average credits-per-execution over [start, end].


        Capped at ANALYTICS_MAX_DAYS days. Returns only blocks whose current cost

        type is dynamic (SECOND/ITEMS/COST_USD) — static-cost blocks already

        charge correctly pre-flight and don''t need an estimate override. TOKENS

        is excluded because `compute_token_credits` already supplies a per-model

        floor at pre-flight; a per-block historical mean would lose that

        granularity.'
      operationId: getV2Export block cost estimates
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: ISO timestamp (inclusive)
          title: Start
        description: ISO timestamp (inclusive)
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: ISO timestamp (inclusive)
          title: End
        description: ISO timestamp (inclusive)
      - name: min_samples
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Minimum executions per block to include
          default: 10
          title: Min Samples
        description: Minimum executions per block to include
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockCostEstimatesResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/bot-analytics/command-usage:
    get:
      tags:
      - v2
      summary: Command Usage Breakdown
      operationId: getV2Command usage breakdown
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotCommandUsage'
                title: Response Getv2Command Usage Breakdown
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/bot-analytics/guilds:
    get:
      tags:
      - v2
      summary: Bot Server Roster
      operationId: getV2Bot server roster
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: include_left
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Left
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotGuildInfo'
                title: Response Getv2Bot Server Roster
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/bot-analytics/server-timeseries:
    get:
      tags:
      - v2
      summary: Bot Server-Count Timeseries (sharding curve)
      operationId: getV2Bot server-count timeseries (sharding curve)
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotServerCountPoint'
                title: Response Getv2Bot Server-Count Timeseries (Sharding Curve)
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/bot-analytics/summary:
    get:
      tags:
      - v2
      summary: Bot Usage Summary
      operationId: getV2Bot usage summary
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotAnalyticsSummary'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/bot-analytics/timeseries:
    get:
      tags:
      - v2
      summary: Bot Message Timeseries
      operationId: getV2Bot message timeseries
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotTimeseriesPoint'
                title: Response Getv2Bot Message Timeseries
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/bot-analytics/top-servers:
    get:
      tags:
      - v2
      summary: Top Servers by Activity
      operationId: getV2Top servers by activity
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotServerActivity'
                title: Response Getv2Top Servers By Activity
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/diagnostics/agents:
    get:
      tags:
      - v2
      summary: Get Agent Diagnostics
      description: 'Get diagnostic information about agents.


        Returns:

        - agents_with_active_executions: Number of unique agents with running/queued executions

        - timestamp: Current timestamp'
      operationId: getV2Get agent diagnostics
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDiagnosticsResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions:
    get:
      tags:
      - v2
      summary: Get Execution Diagnostics
      description: 'Get comprehensive diagnostic information about execution status.


        Returns all execution metrics including:

        - Current state (running, queued)

        - Orphaned executions (>24h old, likely not in executor)

        - Failure metrics (1h, 24h, rate)

        - Long-running detection (stuck >1h, >24h)

        - Stuck queued detection

        - Throughput metrics (completions/hour)

        - RabbitMQ queue depths'
      operationId: getV2Get execution diagnostics
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionDiagnosticsResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/cleanup-all-orphaned:
    post:
      tags:
      - v2
      summary: Cleanup ALL Orphaned Executions
      description: 'Cleanup ALL orphaned executions (>24h old) by directly updating DB status.

        Operates on all executions, not just paginated results.


        Returns:

        Number of executions cleaned up and success message'
      operationId: postV2Cleanup all orphaned executions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/cleanup-all-stuck-queued:
    post:
      tags:
      - v2
      summary: Cleanup ALL Stuck Queued Executions
      description: 'Cleanup ALL stuck queued executions (QUEUED >1h) by updating DB status (admin only).

        Operates on entire dataset, not limited to pagination.


        Returns:

        Number of executions cleaned up and success message'
      operationId: postV2Cleanup all stuck queued executions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/cleanup-orphaned:
    post:
      tags:
      - v2
      summary: Cleanup Orphaned Executions
      description: 'Cleanup orphaned executions by directly updating DB status (admin only).

        For executions in DB but not actually running in executor (old/stale records).


        Args:

        request: Contains list of execution_ids to cleanup


        Returns:

        Number of executions cleaned up and success message'
      operationId: postV2Cleanup orphaned executions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopExecutionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/failed:
    get:
      tags:
      - v2
      summary: List Failed Executions
      description: 'Get detailed list of failed executions.


        Args:

        limit: Maximum number of executions to return (default 100)

        offset: Number of executions to skip (default 0)

        hours: Number of hours to look back (default 24)


        Returns:

        List of failed executions with error details'
      operationId: getV2List failed executions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          default: 24
          title: Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedExecutionsListResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/diagnostics/executions/invalid:
    get:
      tags:
      - v2
      summary: List Invalid Executions
      description: 'Get detailed list of executions in invalid states (READ-ONLY).


        Invalid states indicate data corruption and require manual investigation:

        - QUEUED but has startedAt (impossible - can''t start while queued)

        - RUNNING but no startedAt (impossible - can''t run without starting)


        ⚠️ NO BULK ACTIONS PROVIDED - These need case-by-case investigation.


        Each invalid execution likely has a different root cause (crashes, race conditions,

        DB corruption). Investigate the execution history and logs to determine appropriate

        action (manual cleanup, status fix, or leave as-is if system recovered).


        Args:

        limit: Maximum number of executions to return (default 100)

        offset: Number of executions to skip (default 0)


        Returns:

        List of invalid state executions with details'
      operationId: getV2List invalid executions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningExecutionsListResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/diagnostics/executions/long-running:
    get:
      tags:
      - v2
      summary: List Long-Running Executions
      description: 'Get detailed list of long-running executions (RUNNING status >24h).


        Args:

        limit: Maximum number of executions to return (default 100)

        offset: Number of executions to skip (default 0)


        Returns:

        List of long-running executions with details'
      operationId: getV2List long-running executions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningExecutionsListResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/diagnostics/executions/orphaned:
    get:
      tags:
      - v2
      summary: List Orphaned Executions
      description: 'Get detailed list of orphaned executions (>24h old, likely not in executor).


        Args:

        limit: Maximum number of executions to return (default 100)

        offset: Number of executions to skip (default 0)


        Returns:

        List of orphaned executions with details'
      operationId: getV2List orphaned executions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningExecutionsListResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/diagnostics/executions/requeue:
    post:
      tags:
      - v2
      summary: Requeue Stuck Execution
      description: 'Requeue a stuck QUEUED execution (admin only).


        Uses add_graph_execution with existing graph_exec_id to requeue.


        ⚠️ WARNING: Only use for stuck executions. This will re-execute and may cost credits.


        Args:

        request: Contains execution_id to requeue


        Returns:

        Success status and message'
      operationId: postV2Requeue stuck execution
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopExecutionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequeueExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/requeue-all-stuck:
    post:
      tags:
      - v2
      summary: Requeue ALL Stuck Queued Executions
      description: 'Requeue ALL stuck queued executions (QUEUED >1h) by publishing to RabbitMQ.

        Operates on all executions, not just paginated results.


        Uses add_graph_execution with existing graph_exec_id to requeue.


        ⚠️ WARNING: This will re-execute ALL stuck executions and may cost significant credits.


        Returns:

        Number of executions requeued and success message'
      operationId: postV2Requeue all stuck queued executions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequeueExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/requeue-bulk:
    post:
      tags:
      - v2
      summary: Requeue Multiple Stuck Executions
      description: 'Requeue multiple stuck QUEUED executions (admin only).


        Uses add_graph_execution with existing graph_exec_id to requeue.


        ⚠️ WARNING: Only use for stuck executions. This will re-execute and may cost credits.


        Args:

        request: Contains list of execution_ids to requeue


        Returns:

        Number of executions requeued and success message'
      operationId: postV2Requeue multiple stuck executions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopExecutionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequeueExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/running:
    get:
      tags:
      - v2
      summary: List Running Executions
      description: 'Get detailed list of running and queued executions (recent, likely active).


        Args:

        limit: Maximum number of executions to return (default 100)

        offset: Number of executions to skip (default 0)


        Returns:

        List of running executions with details'
      operationId: getV2List running executions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningExecutionsListResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/diagnostics/executions/stop:
    post:
      tags:
      - v2
      summary: Stop Single Execution
      description: 'Stop a single execution (admin only).


        Uses robust stop_graph_execution which cascades to children and waits for termination.


        Args:

        request: Contains execution_id to stop


        Returns:

        Success status and message'
      operationId: postV2Stop single execution
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopExecutionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/stop-all-long-running:
    post:
      tags:
      - v2
      summary: Stop ALL Long-Running Executions
      description: 'Stop ALL long-running executions (RUNNING >24h) by sending cancel signals (admin only).

        Operates on entire dataset, not limited to pagination.


        Returns:

        Number of executions stopped and success message'
      operationId: postV2Stop all long-running executions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/stop-bulk:
    post:
      tags:
      - v2
      summary: Stop Multiple Executions
      description: 'Stop multiple active executions (admin only).


        Uses robust stop_graph_execution which cascades to children and waits for termination.


        Args:

        request: Contains list of execution_ids to stop


        Returns:

        Number of executions stopped and success message'
      operationId: postV2Stop multiple executions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopExecutionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopExecutionResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
  /api/admin/diagnostics/executions/stuck-queued:
    get:
      tags:
      - v2
      summary: List Stuck Queued Executions
      description: 'Get detailed list of stuck queued executions (QUEUED >1h, never started).


        Args:

        limit: Maximum number of executions to return (default 100)

        offset: Number of executions to skip (default 0)


        Returns:

        List of stuck queued executions with details'
      operationId: getV2List stuck queued executions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
