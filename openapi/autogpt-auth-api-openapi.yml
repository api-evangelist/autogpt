openapi: 3.2.0
info:
  title: AutoGPT Agent Server Auth API
  summary: AutoGPT Agent Server
  description: This server is used to execute agents that are created by the AutoGPT system.
  version: '0.1'
tags:
- name: Auth
paths:
  /api/auth/user:
    post:
      tags:
      - Auth
      summary: Get or create user
      operationId: postV1GetOrCreateUser
      responses:
        '200':
          description: Successful Response
          headers:
            X-AutoGPT-User-Created:
              description: Whether this request created a new user
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV1Get or create user
  /api/auth/user/email:
    post:
      tags:
      - Auth
      summary: Update user email
      operationId: postV1UpdateUserEmail
      requestBody:
        content:
          application/json:
            schema:
              type: string
              title: Email
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Postv1Update User Email
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV1Update user email
  /api/auth/user/preferences:
    get:
      tags:
      - Auth
      summary: Get notification preferences
      operationId: getV1GetNotificationPreferences
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: getV1Get notification preferences
    post:
      tags:
      - Auth
      summary: Update notification preferences
      operationId: postV1UpdateNotificationPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceDTO'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV1Update notification preferences
  /api/auth/user/preferences/from-email:
    post:
      tags:
      - Auth
      summary: Apply a volume-knob choice from a Briefing footer link
      description: 'Apply one footer choice, authorised by the token in the link.


        Deliberately not `Security(requires_user)`. The session is the wrong

        authority here: the settings page applies this on arrival, so a

        session-authenticated write would let any third party change a logged-in

        reader''s preferences just by getting them to follow a link. The HMAC binds

        the choice to the recipient we sent it to, exactly as the unsubscribe link

        does, and works whether or not they happen to be signed in.'
      operationId: postV1ApplyAVolume-knobChoiceFromABriefingFooterLink
      parameters:
      - name: choice
        in: query
        required: true
        schema:
          type: string
          title: Choice
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV1Apply a volume-knob choice from a briefing footer link
  /api/auth/user/timezone:
    get:
      tags:
      - Auth
      summary: Get user timezone
      description: Get user timezone setting.
      operationId: getV1GetUserTimezone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: getV1Get user timezone
    post:
      tags:
      - Auth
      summary: Update user timezone
      description: Update user timezone. The timezone should be a valid IANA timezone identifier.
      operationId: postV1UpdateUserTimezone
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTimezoneRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV1Update user timezone
components:
  schemas:
    NotificationPreferenceDTO:
      properties:
        email:
          type: string
          format: email
          title: Email
        briefing_frequency:
          $ref: '#/components/schemas/BriefingFrequency'
        alerts_enabled:
          type: boolean
          title: Alerts Enabled
        store_verdicts_enabled:
          type: boolean
          title: Store Verdicts Enabled
        daily_limit:
          type: integer
          title: Daily Limit
          description: Max product emails per day; 0 sends none. Account and billing messages are service mail and ignore it.
          default: 3
      type: object
      required:
      - email
      - briefing_frequency
      - alerts_enabled
      - store_verdicts_enabled
      title: NotificationPreferenceDTO
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
