openapi: 3.2.0
info:
  title: Autogpt Integrations API
  version: '1.0'
  description: 'Operations tagged integrations across 2 of this provider''s published API definitions: autogpt-agent-server-openapi.json, autogpt-external-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /external-api
tags:
- name: Integrations
paths:
  /api/integrations/ayrshare/sso_url:
    get:
      tags:
      - Integrations
      summary: Get Ayrshare Sso Url
      description: 'Generate a JWT SSO URL so the user can link their social accounts.


        The per-user Ayrshare profile key is provisioned and persisted as a

        standard ``is_managed=True`` credential by

        :class:`~backend.integrations.managed_providers.ayrshare.AyrshareManagedProvider`.

        This endpoint only signs a short-lived JWT pointing at the Ayrshare-

        hosted social-linking page; all profile lifecycle logic lives with the

        managed provider.'
      operationId: getV1GetAyrshareSsoUrl
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AyrshareSSOResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
  /api/integrations/codex/credentials/{credential_id}/account:
    get:
      tags:
      - Integrations
      summary: Codex Account
      operationId: getV1CodexAccount
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          title: Credential Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexAccountSnapshot'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/integrations/codex/credentials/{credential_id}/rate-limits:
    get:
      tags:
      - Integrations
      summary: Codex Rate Limits
      operationId: getV1CodexRateLimits
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          title: Credential Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexRateLimitsSnapshot'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/integrations/credentials:
    get:
      tags:
      - Integrations
      summary: List Credentials
      operationId: getV1ListCredentials
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CredentialsMetaResponse'
                type: array
                title: Response Getv1List Credentials
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: getV1List credentials
  /api/integrations/providers:
    get:
      tags:
      - Integrations
      summary: List Providers
      description: 'Get metadata for every available provider.


        Returns both statically defined providers (from ``ProviderName`` enum) and

        dynamically registered providers (from SDK decorators). Each entry includes

        a ``description`` declared via ``ProviderBuilder.with_description(...)`` in

        the provider''s ``_config.py``.


        Note: The complete list of provider names is also available as a constant

        in the generated TypeScript client via PROVIDER_NAMES.'
      operationId: getV1ListProviders
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProviderMetadata'
                type: array
                title: Response Getv1Listproviders
      security:
      - HTTPBearer: []
  /api/integrations/providers/constants:
    get:
      tags:
      - Integrations
      summary: Get Provider Constants
      description: 'Get provider names as constants.


        This endpoint returns a model with provider names as constants,

        specifically designed for OpenAPI code generation tools to create

        TypeScript constants.'
      operationId: getV1GetProviderConstants
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConstants'
  /api/integrations/providers/enum-example:
    get:
      tags:
      - Integrations
      summary: Get Provider Enum Example
      description: 'Example endpoint that uses the CompleteProviderNames enum.


        This endpoint exists to ensure that the CompleteProviderNames enum is included

        in the OpenAPI schema, which will cause Orval to generate it as a

        TypeScript enum/constant.'
      operationId: getV1GetProviderEnumExample
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEnumResponse'
  /api/integrations/providers/names:
    get:
      tags:
      - Integrations
      summary: Get Provider Names
      description: 'Get all provider names in a structured format.


        This endpoint is specifically designed to expose the provider names

        in the OpenAPI schema so that code generators like Orval can create

        appropriate TypeScript constants.'
      operationId: getV1GetProviderNames
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderNamesResponse'
  /api/integrations/providers/system:
    get:
      tags:
      - Integrations
      summary: List System Providers
      description: 'Get a list of providers that have platform credits (system credentials) available.


        These providers can be used without the user providing their own API keys.'
      operationId: getV1ListSystemProviders
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Getv1Listsystemproviders
  /api/integrations/webhooks/{webhook_id}/ping:
    post:
      tags:
      - Integrations
      summary: Webhook Ping
      operationId: postV1WebhookPing
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          title: Our ID for the webhook
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/integrations/{provider}/callback:
    post:
      tags:
      - Integrations
      summary: Exchange OAuth code for tokens
      operationId: postV1ExchangeOauthCodeForTokens
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The target provider for this OAuth exchange
          description: Provider name for integrations. Can be any string value, including custom provider names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_postV1Exchange_oauth_code_for_tokens'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsMetaResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV1Exchange oauth code for tokens
  /api/integrations/{provider}/credentials:
    get:
      tags:
      - Integrations
      summary: List Credentials By Provider
      operationId: getV1ListCredentialsByProvider
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to list credentials for
          description: Provider name for integrations. Can be any string value, including custom provider names.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialsMetaResponse'
                title: Response Getv1Listcredentialsbyprovider
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Integrations
      summary: Create Credentials
      operationId: postV1CreateCredentials
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to create credentials for
          description: Provider name for integrations. Can be any string value, including custom provider names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/OAuth2Credentials'
              - $ref: '#/components/schemas/APIKeyCredentials'
              - $ref: '#/components/schemas/UserPasswordCredentials'
              - $ref: '#/components/schemas/HostScopedCredentials'
              discriminator:
                propertyName: type
                mapping:
                  oauth2: '#/components/schemas/OAuth2Credentials'
                  api_key: '#/components/schemas/APIKeyCredentials'
                  user_password: '#/components/schemas/UserPasswordCredentials'
                  host_scoped: '#/components/schemas/HostScopedCredentials'
              title: Credentials
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsMetaResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV1Create credentials
  /api/integrations/{provider}/credentials/{cred_id}:
    delete:
      tags:
      - Integrations
      summary: Delete Credentials
      operationId: deleteV1DeleteCredentials
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to delete credentials for
          description: Provider name for integrations. Can be any string value, including custom provider names.
      - name: cred_id
        in: path
        required: true
        schema:
          type: string
          title: The ID of the credentials to delete
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          title: Whether to proceed if any linked webhooks are still in use
          default: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CredentialsDeletionResponse'
                - $ref: '#/components/schemas/CredentialsDeletionNeedsConfirmationResponse'
                title: Response Deletev1Deletecredentials
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Integrations
      summary: Get Specific Credential By ID
      operationId: getV1GetSpecificCredentialById
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to retrieve credentials for
          description: Provider name for integrations. Can be any string value, including custom provider names.
      - name: cred_id
        in: path
        required: true
        schema:
          type: string
          title: The ID of the credentials to retrieve
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsMetaResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV1Get specific credential by id
  /api/integrations/{provider}/credentials/{cred_id}/picker-token:
    post:
      tags:
      - Integrations
      summary: Issue a short-lived access token for a provider-hosted picker
      description: 'Return the raw access token for an OAuth2 credential so the frontend

        can initialize a provider-hosted picker (e.g. Google Drive Picker).


        `GET /{provider}/credentials/{cred_id}` deliberately strips secrets (see

        `CredentialsMetaResponse` + `TestGetCredentialReturnsMetaOnly` in

        `router_test.py`). That hardening broke the Drive picker, which needs the

        raw access token to call `google.picker.Builder.setOAuthToken(...)`. This

        endpoint carves a narrow, explicit hole: the caller must own the

        credential, it must be OAuth2, and the endpoint returns only the access

        token + its expiry — nothing else about the credential. SDK-default

        credentials are excluded for the same reason as `get_credential`.'
      operationId: postV1GetPickerToken
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider that owns the credentials
          description: Provider name for integrations. Can be any string value, including custom provider names.
      - name: cred_id
        in: path
        required: true
        schema:
          type: string
          title: The ID of the OAuth2 credentials to mint a token from
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickerTokenResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/integrations/{provider}/device-auth/initiate:
    post:
      tags:
      - Integrations
      summary: Initiate device code OAuth flow
      operationId: postV1InitiateDeviceCodeOauthFlow
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to initiate device auth for
          description: Provider name for integrations. Can be any string value, including custom provider names.
      - name: scopes
        in: query
        required: false
        schema:
          type: string
          title: Comma-separated list of authorization scopes
          default: ''
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthInitiateResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV1Initiate device code oauth flow
  /api/integrations/{provider}/device-auth/poll:
    post:
      tags:
      - Integrations
      summary: Poll device code OAuth flow for completion
      operationId: postV1PollDeviceCodeOauthFlowForCompletion
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to poll device auth for
          description: Provider name for integrations. Can be any string value, including custom provider names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthPollRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthPollResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV1Poll device code oauth flow for completion
  /api/integrations/{provider}/login:
    get:
      tags:
      - Integrations
      summary: Initiate OAuth flow
      operationId: getV1InitiateOauthFlow
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to initiate an OAuth flow for
          description: Provider name for integrations. Can be any string value, including custom provider names.
      - name: scopes
        in: query
        required: false
        schema:
          type: string
          title: Comma-separated list of authorization scopes
          default: ''
      - name: credential_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: ID of existing credential to upgrade scopes for
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV1Initiate oauth flow
  /api/integrations/{provider}/webhooks/{webhook_id}/ingress:
    post:
      tags:
      - Integrations
      summary: Webhook Ingress Generic
      operationId: postV1WebhookIngressGeneric
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider where the webhook was registered
          description: Provider name for integrations. Can be any string value, including custom provider names.
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          title: Our ID for the webhook
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/integrations/providers:
    get:
      tags:
      - Integrations
      summary: List Providers
      description: 'List all available integration providers.


        Returns a list of all providers with their supported credential types.

        Most providers support API key credentials, and some also support OAuth.'
      operationId: list_providers_v1_integrations_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProviderInfo'
                type: array
                title: Response List Providers V1 Integrations Providers Get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
    servers:
    - url: /external-api
  /v1/integrations/{provider}/oauth/initiate:
    post:
      tags:
      - Integrations
      summary: Initiate OAuth flow
      description: 'Initiate an OAuth flow for an external application.


        This endpoint allows external apps to start an OAuth flow with a custom

        callback URL. The callback URL must be from an allowed origin configured

        in the platform settings.


        Returns a login URL to redirect the user to, along with a state token

        for CSRF protection.'
      operationId: initiate_oauth_v1_integrations__provider__oauth_initiate_post
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The OAuth provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthInitiateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthInitiateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: /external-api
  /v1/integrations/{provider}/oauth/complete:
    post:
      tags:
      - Integrations
      summary: Complete OAuth flow
      description: 'Complete an OAuth flow by exchanging the authorization code for tokens.


        This endpoint should be called after the user has authorized the application

        and been redirected back to the external app''s callback URL with an

        authorization code.'
      operationId: complete_oauth_v1_integrations__provider__oauth_complete_post
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The OAuth provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCompleteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCompleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: /external-api
  /v1/integrations/credentials:
    get:
      tags:
      - Integrations
      summary: List Credentials
      description: 'List all credentials for the authenticated user.


        Returns metadata about each credential without exposing sensitive tokens.'
      operationId: list_credentials_v1_integrations_credentials_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CredentialsMetaResponse'
                type: array
                title: Response List Credentials V1 Integrations Credentials Get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
    servers:
    - url: /external-api
  /v1/integrations/{provider}/credentials:
    get:
      tags:
      - Integrations
      summary: List Credentials By Provider
      description: List credentials for a specific provider.
      operationId: list_credentials_by_provider_v1_integrations__provider__credentials_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to list credentials for
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialsMetaResponse'
                title: Response List Credentials By Provider V1 Integrations  Provider  Credentials Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Integrations
      summary: Create credentials
      description: 'Create non-OAuth credentials for a provider.


        Supports creating:

        - API key credentials (type: "api_key")

        - Username/password credentials (type: "user_password")

        - Host-scoped credentials (type: "host_scoped")


        For OAuth credentials, use the OAuth initiate/complete flow instead.'
      operationId: create_credential_v1_integrations__provider__credentials_post
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider to create credentials for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CreateAPIKeyCredentialRequest'
              - $ref: '#/components/schemas/CreateUserPasswordCredentialRequest'
              - $ref: '#/components/schemas/CreateHostScopedCredentialRequest'
              discriminator:
                propertyName: type
                mapping:
                  api_key: '#/components/schemas/CreateAPIKeyCredentialRequest'
                  user_password: '#/components/schemas/CreateUserPasswordCredentialRequest'
                  host_scoped: '#/components/schemas/CreateHostScopedCredentialRequest'
              title: Request
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: /external-api
  /v1/integrations/{provider}/credentials/{cred_id}:
    delete:
      tags:
      - Integrations
      summary: Delete Credential
      description: 'Delete a credential.


        Note: This does not revoke the tokens with the provider. For full cleanup,

        use the main API''s delete endpoint which handles webhook cleanup and

        token revocation.'
      operationId: delete_credential_v1_integrations__provider__credentials__cred_id__delete
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: The provider
      - name: cred_id
