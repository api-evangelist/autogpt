  /v1/store/creators:
    get:
      tags:
      - Store
      summary: Get Store Creators
      description: 'Get a paginated list of store creators with optional filtering and sorting.


        Args:

        featured: Filter to only show featured creators

        search_query: Search creators by profile description

        sorted_by: Sort by "agent_rating", "agent_runs", or "num_agents"

        page: Page number for pagination (default 1)

        page_size: Number of creators per page (default 20)


        Returns:

        CreatorsResponse: Paginated list of creators matching the filters'
      operationId: get_store_creators_v1_store_creators_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: featured
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Featured
      - name: search_query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search Query
      - name: sorted_by
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StoreCreatorsSortOptions'
          - type: 'null'
          title: Sorted By
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: /external-api
