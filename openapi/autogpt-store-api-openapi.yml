openapi: 3.2.0
info:
  title: Autogpt Store API
  version: '1.0'
  description: 'Operations tagged store across 2 of this provider''s published API definitions: autogpt-agent-server-openapi.json, autogpt-external-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /external-api
tags:
- name: Store
paths:
  /api/builder/search:
    get:
      tags:
      - Store
      summary: Builder search
      description: Search for blocks (including integrations), marketplace agents, and user library agents.
      operationId: getV2BuilderSearch
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: search_query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search Query
      - name: filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter
      - name: search_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search Id
      - name: by_creator
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: By Creator
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Builder search
  /api/store/agents:
    get:
      tags:
      - Store
      summary: List store agents
      description: 'Get a paginated list of agents from the marketplace,

        with optional filtering and sorting.


        Used for:

        - Home Page Featured Agents

        - Home Page Top Agents

        - Search Results

        - Agent Details - Other Agents By Creator

        - Agent Details - Similar Agents

        - Creator Details - Agents By Creator'
      operationId: getV2ListStoreAgents
      parameters:
      - name: featured
        in: query
        required: false
        schema:
          type: boolean
          description: Filter to only show featured agents
          default: false
          title: Featured
        description: Filter to only show featured agents
      - name: creator
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter agents by creator username
          title: Creator
        description: Filter agents by creator username
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter agents by category
          title: Category
        description: Filter agents by category
      - name: search_query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Literal + semantic search on names and descriptions
          title: Search Query
        description: Literal + semantic search on names and descriptions
      - name: sorted_by
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StoreAgentsSortOptions'
          - type: 'null'
          description: Property to sort results by. Ignored if search_query is provided.
          title: Sorted By
        description: Property to sort results by. Ignored if search_query is provided.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAgentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2List store agents
  /api/store/agents/{username}/{agent_name}:
    get:
      tags:
      - Store
      summary: Get specific agent
      description: Get details of a marketplace agent
      operationId: getV2GetSpecificAgent
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      - name: agent_name
        in: path
        required: true
        schema:
          type: string
          title: Agent Name
      - name: include_changelog
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Changelog
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAgentDetails'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get specific agent
  /api/store/agents/{username}/{agent_name}/review:
    post:
      tags:
      - Store
      summary: Create agent review
      description: Post a user review on a marketplace agent listing
      operationId: postV2CreateAgentReview
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      - name: agent_name
        in: path
        required: true
        schema:
          type: string
          title: Agent Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreReviewCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreReview'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV2Create agent review
  /api/store/creators:
    get:
      tags:
      - Store
      summary: List store creators
      description: List or search marketplace creators
      operationId: getV2ListStoreCreators
      parameters:
      - name: featured
        in: query
        required: false
        schema:
          type: boolean
          description: Filter to only show featured creators
          default: false
          title: Featured
        description: Filter to only show featured creators
      - name: search_query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Literal + semantic search on names and descriptions
          title: Search Query
        description: Literal + semantic search on names and descriptions
      - name: sorted_by
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StoreCreatorsSortOptions'
          - type: 'null'
          title: Sorted By
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2List store creators
  /api/store/creators/{username}:
    get:
      tags:
      - Store
      summary: Get creator details
      description: Get details on a marketplace creator
      operationId: getV2GetCreatorDetails
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorDetails'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get creator details
  /api/store/listings/versions/{store_listing_version_id}:
    get:
      tags:
      - Store
      summary: Get agent by version
      operationId: getV2GetAgentByVersion
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: store_listing_version_id
        in: path
        required: true
        schema:
          type: string
          title: Store Listing Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAgentDetails'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get agent by version
  /api/store/listings/versions/{store_listing_version_id}/graph:
    get:
      tags:
      - Store
      summary: Get agent graph
      description: Get outline of graph belonging to a specific marketplace listing version
      operationId: getV2GetAgentGraph
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: store_listing_version_id
        in: path
        required: true
        schema:
          type: string
          title: Store Listing Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphModelWithoutNodes'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get agent graph
  /api/store/listings/versions/{store_listing_version_id}/graph/download:
    get:
      tags:
      - Store
      summary: Download agent file
      description: Download agent graph file for a specific marketplace listing version
      operationId: getV2DownloadAgentFile
      parameters:
      - name: store_listing_version_id
        in: path
        required: true
        schema:
          type: string
          title: Store Listing Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Download agent file
  /api/store/metrics/cache:
    get:
      tags:
      - Store
      summary: Get cache metrics in Prometheus format
      description: 'Get cache metrics in Prometheus text format.


        Returns Prometheus-compatible metrics for monitoring cache performance.

        Metrics include size, maxsize, TTL, and hit rate for each cache.


        Returns:

        str: Prometheus-formatted metrics text'
      operationId: getV2GetCacheMetricsInPrometheusFormat
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get cache metrics in prometheus format
  /api/store/my-unpublished-agents:
    get:
      tags:
      - Store
      summary: Get my agents
      description: List the authenticated user's unpublished agents
      operationId: getV2GetMyAgents
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          title: Page Size
      - name: sort_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MyAgentsSortBy'
          default: most_recent
      - name: search_query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Search Query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyUnpublishedAgentsResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get my agents
  /api/store/profile:
    get:
      tags:
      - Store
      summary: Get user profile
      description: Get the profile details for the authenticated user.
      operationId: getV2GetUserProfile
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetails'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: getV2Get user profile
    post:
      tags:
      - Store
      summary: Update user profile
      description: Update the store profile for the authenticated user.
      operationId: postV2UpdateUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetails'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV2Update user profile
  /api/store/search:
    get:
      tags:
      - Store
      summary: Unified search across all content types
      description: 'Search across all content types (marketplace agents, blocks, documentation)

        using hybrid search.


        Combines semantic (embedding-based) and lexical (text-based) search for best results.'
      operationId: getV2UnifiedSearchAcrossAllContentTypes
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          title: Query
      - name: content_types
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/ContentType'
          - type: 'null'
          description: Content types to search. If not specified, searches all.
          title: Content Types
        description: Content types to search. If not specified, searches all.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2Unified search across all content types
  /api/store/submissions:
    get:
      tags:
      - Store
      summary: List my submissions
      description: List the authenticated user's marketplace listing submissions
      operationId: getV2ListMySubmissions
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          title: Page Size
      - name: search_query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Search Query
      - name: statuses
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Statuses
      - name: sort_key
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - submitted
            - runs
            type: string
          - type: 'null'
          title: Sort Key
      - name: sort_dir
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: desc
          title: Sort Dir
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSubmissionsResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: getV2List my submissions
    post:
      tags:
      - Store
      summary: Create store submission
      description: Submit a new marketplace listing for review
      operationId: postV2CreateStoreSubmission
      security:
      - HTTPBearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSubmissionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSubmission'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV2Create store submission
  /api/store/submissions/generate_image:
    post:
      tags:
      - Store
      summary: Generate submission image
      description: 'Generate an image for a marketplace listing submission based on the properties

        of a given graph.'
      operationId: postV2GenerateSubmissionImage
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: graph_id
        in: query
        required: true
        schema:
          type: string
          title: Graph Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageURLResponse'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: postV2Generate submission image
  /api/store/submissions/media:
    post:
      tags:
      - Store
      summary: Upload submission media
      description: Upload media for a marketplace listing submission
      operationId: postV2UploadSubmissionMedia
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_postV2Upload_submission_media'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Postv2Upload Submission Media
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearerJWT: []
      x-operation-id-source: normalized
      x-operation-id-original: postV2Upload submission media
  /api/store/submissions/{store_listing_version_id}:
    put:
      tags:
      - Store
      summary: Edit store submission
      description: Update a pending marketplace listing submission
      operationId: putV2EditStoreSubmission
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: store_listing_version_id
        in: path
        required: true
        schema:
          type: string
          title: Store Listing Version Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSubmissionEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSubmission'
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: putV2Edit store submission
  /api/store/submissions/{submission_id}:
    delete:
      tags:
      - Store
      summary: Delete store submission
      description: Delete a marketplace listing submission
      operationId: deleteV2DeleteStoreSubmission
      security:
      - HTTPBearerJWT: []
      parameters:
      - name: submission_id
        in: path
        required: true
        schema:
          type: string
          title: Submission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: boolean
                title: Response Deletev2Delete Store Submission
        '401':
          $ref: '#/components/responses/HTTP401NotAuthenticatedError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: deleteV2Delete store submission
  /v1/store/agents:
    get:
      tags:
      - Store
      summary: Get Store Agents
      description: 'Get a paginated list of agents from the store with optional filtering and sorting.


        Args:

        featured: Filter to only show featured agents

        creator: Filter agents by creator username

        sorted_by: Sort agents by "runs", "rating", "name", or "updated_at"

        search_query: Search agents by name, subheading and description

        category: Filter agents by category

        page: Page number for pagination (default 1)

        page_size: Number of agents per page (default 20)


        Returns:

        StoreAgentsResponse: Paginated list of agents matching the filters'
      operationId: get_store_agents_v1_store_agents_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: featured
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Featured
      - name: creator
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Creator
      - name: sorted_by
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StoreAgentsSortOptions'
          - type: 'null'
          title: Sorted By
      - name: search_query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search Query
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAgentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: /external-api
  /v1/store/agents/{username}/{agent_name}:
    get:
      tags:
      - Store
      summary: Get Store Agent
      description: 'Get details of a specific store agent by username and agent name.


        Args:

        username: Creator''s username

        agent_name: Name/slug of the agent


        Returns:

        StoreAgentDetails: Detailed information about the agent'
      operationId: get_store_agent_v1_store_agents__username___agent_name__get
      security:
      - APIKeyHeader: []
