notes:
  - >-
    agpt.co and platform.agpt.co are Next.js apps that answer /.well-known/*
    with an HTML 404 page. backend.agpt.co (FastAPI) answers with a JSON
    {"detail":"Not Found"} 404. Neither is a false-positive SPA 200.
  - >-
    Recommendation for the provider: publish
    /.well-known/oauth-authorization-server on backend.agpt.co describing the
    existing /api/oauth/authorize, /api/oauth/token, /api/oauth/introspect and
    /api/oauth/revoke endpoints and the ten documented scopes, and a
    /.well-known/security.txt on agpt.co pointing at the GitHub Security
    Advisory intake already documented in SECURITY.md.
