source: >-
  Live unauthenticated GET of every /.well-known/ path on the three AutoGPT
  hosts, 2026-08-29.
description: >-
  RECORDED ABSENCE. Every /.well-known/ path returned 404 on all three AutoGPT
  hosts — the marketing/docs site (agpt.co), the app (platform.agpt.co) and the
  production API (backend.agpt.co). No security.txt, no OAuth/OIDC discovery
  document, no api-catalog, no ai-plugin, no A2A agent card. This is notable
  because AutoGPT DOES run a full OAuth 2.0 + PKCE authorization server at
  /api/oauth/* on backend.agpt.co (authorize, token, introspect, revoke) — the
  metadata document that would let a client discover it (RFC 8414
  /.well-known/oauth-authorization-server) is simply not served. No apis.yml
  WellKnown or SecurityTxt pointer is emitted, because nothing was served.
