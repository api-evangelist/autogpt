source: >-
  Derived from openapi/autogpt-external-api-openapi.json after searching for a
  published AutoGPT MCP server. Direction confirmed from
  https://agpt.co/docs/integrations/block-integrations/block.md (the MCP Block)
  and the /api/mcp/* routes in
  openapi/autogpt-agent-server-openapi.json.
description: >-
  AutoGPT publishes NO MCP server. The relationship is the other way round:
  AutoGPT is an MCP CLIENT. Its "MCP Tool" block connects an AutoGPT agent to
  any third-party MCP server over Streamable HTTP JSON-RPC 2.0 — sending
  initialize, then tools/list to discover tools and their input schemas, then
  tools/call — with optional OAuth 2.0 + PKCE and automatic token refresh. The
  platform backend backs that block with POST /api/mcp/discover-tools,
  /api/mcp/oauth/login, /api/mcp/oauth/callback and /api/mcp/token. None of
  those is an MCP endpoint an agent can call; they are the client's own control
  plane. The tools[] below are a DERIVED CANDIDATE mapping of what an AutoGPT
  MCP server would expose if one existed, taken from the 20 real operations of
  the AutoGPT External API. Nothing here is live.
status: candidate
deployment:
  mode: none
  auth: unknown
  verified: derived
  note: >-
    Searched for a hosted endpoint (mcp.agpt.co, backend.agpt.co/mcp) and for an
    installable package (@autogpt/* on npm is unclaimed; no MCP package on PyPI
    under the Significant-Gravitas name). Neither exists. No endpoint URL is
    guessed here on purpose.
mcp_client_capability:
  role: client
  docs: https://agpt.co/docs/integrations/block-integrations/block.md
  block: MCP Tool
  transport: Streamable HTTP, JSON-RPC 2.0
  methods_used:
    - initialize
    - tools/list
    - tools/call
  auth: >-
    Optional credentials. Public MCP servers work anonymously; protected servers
    trigger a standard OAuth 2.0 flow with PKCE, and tokens are refreshed
    automatically.
  backing_operations:
    - POST /api/mcp/discover-tools
    - POST /api/mcp/oauth/login
    - POST /api/mcp/oauth/callback
    - POST /api/mcp/token
tools:
