apis:
  - aid: autogpt:autogpt
    name: AutoGPT External API
    description: >-
      The documented, third-party-facing REST API of the AutoGPT Platform. Twenty
      operations that find and run AutoGPT agents, execute individual blocks,
      create agent graphs, read graph execution results, browse the agent
      marketplace, and manage the third-party integration credentials an agent
      acts on. Authenticate with an account API key in an X-API-Key header or an
      OAuth 2.0 bearer token prefixed agpt_xt_. Runs are asynchronous and
      metered in automation credits.
    humanURL: https://agpt.co/docs/platform/api-and-integrations/api-guide
    baseURL: https://backend.agpt.co/external-api
    tags:
      - AI Automation
      - AI Agents
      - Agent Execution
    properties:
      - type: OpenAPI
        url: openapi/autogpt-external-api-openapi.json
      - type: Documentation
        url: https://agpt.co/docs/platform/api-and-integrations/api-guide
      - type: APIReference
        url: https://backend.agpt.co/external-api/docs
      - type: Sandbox
        url: sandbox/autogpt-sandbox.yml
      - type: Overlay
        url: overlays/autogpt-external-api-overlay.yaml
      - type: AgentSkill
        url: skills/_index.yml
  - aid: autogpt:autogpt-agent-server
    name: AutoGPT Agent Server API
    description: >-
      The AutoGPT Platform's own backend API — 293 paths, 347 operations and 458
      schemas covering graphs, executions, schedules, the library, the agent
      marketplace, credits and billing, organizations, workspaces, experts,
      copilot chat, OAuth applications, API keys and integrations. AutoGPT
      publishes this OpenAPI openly at backend.agpt.co/openapi.json but does not
      document it for third parties; the External API is the supported surface.
      Recorded here because it is published, parses, and is where the OAuth
      authorization server, the API-key management surface and the credit
      wallet actually live.
    humanURL: https://agpt.co/docs
    baseURL: https://backend.agpt.co
    tags:
      - AI Automation
      - Agent Execution
      - Platform API
    properties:
      - type: OpenAPI
        url: openapi/autogpt-agent-server-openapi.json
      - type: Documentation
        url: https://agpt.co/docs
