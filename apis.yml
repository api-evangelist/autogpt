aid: autogpt
name: AutoGPT
description: >-
  AutoGPT, from Significant Gravitas, is an open-source platform for building,
  deploying and running autonomous AI agents that automate digital work —
  research, outreach, content, support — without writing code. Agents are
  composed as graphs of reusable blocks in a visual builder, or described in
  plain language to AutoPilot, then run continuously on schedules and triggers
  across 45+ connected services. The platform is free to self-host from GitHub
  and also sold as a managed cloud at agpt.co, where work is metered in
  automation credits. Developers reach it through the AutoGPT External API at
  backend.agpt.co/external-api, a 20-operation REST surface authenticated with
  an X-API-Key header or an OAuth 2.0 token, which can find and run agents,
  execute individual blocks, create agent graphs, read execution results and
  manage the third-party credentials agents act on. AutoGPT is also a fluent MCP
  client: its MCP Tool block connects an agent to any Model Context Protocol
  server over Streamable HTTP with OAuth and PKCE.
type: Index
